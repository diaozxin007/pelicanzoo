<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f2"/>
      <stop offset="1" stop-color="#eaf4f0"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a63a"/>
      <stop offset="1" stop-color="#d9791c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="676" cy="96" r="38" fill="#f6d97a"/>
  <path d="M0 372 C 120 336 210 352 300 344 C 420 334 520 356 640 340 C 710 331 760 336 800 330 L800 392 L0 392 Z" fill="#cfe0c8"/>
  <rect y="392" width="800" height="108" fill="#d8cfbd"/>
  <path d="M0 400 H800" stroke="#c2b7a2" stroke-width="3"/>
  <g stroke="#f4efe3" stroke-width="7" stroke-linecap="round" stroke-dasharray="46 40">
    <path d="M0 446 H800"/>
  </g>

  <!-- bicycle -->
  <g fill="none" stroke="#23282c" stroke-linecap="round">
    <g stroke-width="7">
      <circle cx="222" cy="392" r="84"/>
      <circle cx="586" cy="392" r="84"/>
    </g>
    <g stroke="#7d848a" stroke-width="2.5" opacity=".85">
      <path d="M222 308 V476 M138 392 H306 M163 333 L281 451 M281 333 L163 451"/>
      <path d="M586 308 V476 M502 392 H670 M527 333 L645 451 M645 333 L527 451"/>
    </g>
    <g stroke-width="9">
      <path d="M222 392 L404 392 L472 246"/>
      <path d="M404 392 L346 246 L472 246"/>
      <path d="M346 246 L586 392"/>
      <path d="M586 392 L604 250"/>
    </g>
    <!-- handlebar -->
    <path d="M604 250 L604 224 C 604 208 620 202 634 210" stroke-width="9"/>
    <path d="M472 246 L472 226" stroke-width="9"/>
  </g>
  <!-- saddle -->
  <path d="M430 226 C 452 214 494 214 512 224 C 496 236 448 238 430 226 Z" fill="#3a2f26"/>
  <!-- crank + pedal -->
  <g stroke="#23282c" stroke-linecap="round">
    <circle cx="404" cy="392" r="18" fill="none" stroke-width="7"/>
    <path d="M404 392 L438 434" stroke-width="8"/>
  </g>
  <rect x="424" y="430" width="48" height="11" rx="4" fill="#23282c"/>

  <!-- pelican -->
  <g>
    <!-- far leg -->
    <path d="M452 322 L444 400 L452 430" fill="none" stroke="#e0a03c" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    <!-- body -->
    <ellipse cx="452" cy="250" rx="104" ry="76" fill="#fdfdfb"/>
    <path d="M362 286 C 400 320 512 322 550 274 C 534 314 482 336 428 328 C 398 323 374 308 362 286 Z" fill="#e6e6e0"/>
    <!-- tail -->
    <path d="M356 216 C 316 204 292 196 274 178 C 306 182 336 190 362 200 Z" fill="#f2f2ec"/>
    <!-- near leg to pedal -->
    <path d="M462 314 L446 374 L448 428" fill="none" stroke="#f0ae45" stroke-width="12" stroke-linecap="round"/>
    <path d="M448 428 L470 434" fill="none" stroke="#f0ae45" stroke-width="10" stroke-linecap="round"/>
    <!-- neck -->
    <path d="M498 208 C 528 170 566 156 600 164 C 622 170 632 186 630 202 C 620 190 600 184 582 190 C 556 198 536 220 524 244 Z" fill="#fdfdfb"/>
    <!-- head -->
    <circle cx="622" cy="186" r="34" fill="#fdfdfb"/>
    <path d="M618 156 C 634 148 652 152 660 164 C 646 158 630 158 618 164 Z" fill="#e6e6e0"/>
    <!-- beak: upper mandible + pouch -->
    <path d="M650 176 L774 190 C 780 191 780 198 774 199 L648 206 Z" fill="#f7b24a"/>
    <path d="M648 198 C 700 200 748 200 774 199 C 758 234 706 250 676 240 C 656 233 648 216 648 198 Z" fill="url(#pouch)"/>
    <path d="M650 176 L774 190 L648 198 Z" fill="#fac661"/>
    <!-- eye -->
    <circle cx="630" cy="178" r="6.5" fill="#23282c"/>
    <circle cx="632" cy="176" r="2" fill="#fff"/>
    <!-- wing on the handlebar -->
    <path d="M470 232 C 512 214 566 220 604 240 C 578 262 520 268 484 254 C 472 249 466 241 470 232 Z" fill="#f2f2ec" stroke="#ddddd4" stroke-width="2"/>
    <path d="M498 240 C 528 236 558 240 580 248" fill="none" stroke="#ddddd4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- motion lines -->
  <g stroke="#9fb6c4" stroke-width="5" stroke-linecap="round" opacity=".7">
    <path d="M120 232 H208"/>
    <path d="M96 268 H166"/>
    <path d="M134 304 H196"/>
  </g>
</svg>
