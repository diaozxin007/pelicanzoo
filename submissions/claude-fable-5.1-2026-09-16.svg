    <animateTransform attributeName="transform" type="rotate" from="0 340 412" to="360 340 412" dur="1.4s" repeatCount="indefinite"/>
  </g>

  <!-- pelican body (bobs) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0;0,-3;0,0" dur="1.4s" repeatCount="indefinite"/>
