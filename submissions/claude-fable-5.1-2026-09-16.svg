    <path d="M430,136 L548,152 C520,178 470,190 432,150 Z" fill="#f7b544" stroke="#c77d10" stroke-width="2"/>
    <line x1="428" y1="122" x2="548" y2="152" stroke="#c77d10" stroke-width="2"/>
    <!-- eye -->
    <circle cx="420" cy="122" r="4.5" fill="#222"/>
    <circle cx="421.5" cy="120.5" r="1.4" fill="#fff"/>
    <!-- a small cap, in the spirit of the benchmark -->
    <path d="M390,112 Q412,92 436,112 Z" fill="#2c6fd6"/>
    <path d="M388,113 L452,110 L452,116 L388,118 Z" fill="#1f56ad"/>
