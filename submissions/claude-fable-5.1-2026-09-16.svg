    <path d="M345,190 C372,178 372,140 402,130" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
    <path d="M345,190 C372,178 372,140 402,130" fill="none" stroke="#c9c9c9" stroke-width="34" stroke-linecap="round" opacity="0.35"/>
