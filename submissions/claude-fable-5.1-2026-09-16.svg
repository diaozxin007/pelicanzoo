      <animate attributeName="d" dur="0.6s" repeatCount="indefinite"
        values="M382,148 L352,150 L332,156;M382,148 L352,146 L330,150;M382,148 L352,150 L332,156;M382,148 L352,154 L332,160;M382,148 L352,150 L332,156"/>
    </path>
  </g>

