    <path d="M340,412 L250,400 L315,290"/>              <!-- chainstay, seatstay -->
    <path d="M455,300 L510,400"/>                        <!-- fork -->
  </g>
  <g stroke="#333" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M315,290 L309,262"/>                        <!-- seatpost -->
    <path d="M445,275 L440,250 L432,246 M440,250 L452,244"/> <!-- stem, handlebar -->
  </g>
  <path d="M286,262 Q308,250 334,258 L330,266 L292,268 Z" fill="#222"/>   <!-- saddle -->
  <!-- drivetrain -->
  <circle cx="340" cy="412" r="24" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="250" cy="400" r="9" fill="none" stroke="#333" stroke-width="3"/>
  <path d="M340,388 L250,391 M340,436 L250,409" stroke="#444" stroke-width="2.5" stroke-dasharray="4 3"/>
