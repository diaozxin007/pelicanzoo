<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>A cheerful pelican riding a red bicycle</title>
  <defs>
    <linearGradient id="kimi-k3-max--sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3ff"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
    <radialGradient id="kimi-k3-max--sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#ffca28"/>
    </radialGradient>
    <linearGradient id="kimi-k3-max--bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf1"/>
    </linearGradient>
    <linearGradient id="kimi-k3-max--beakGrad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffb648"/>
      <stop offset="1" stop-color="#ff9326"/>
    </linearGradient>
    <linearGradient id="kimi-k3-max--pouchGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffc9b0"/>
      <stop offset="1" stop-color="#ffa587"/>
    </linearGradient>
    <g id="kimi-k3-max--flower">
      <circle cx="0" cy="-7" r="4.2" fill="#ff8fab"/>
      <circle cx="6.7" cy="-2.2" r="4.2" fill="#ff8fab"/>
      <circle cx="4.1" cy="5.7" r="4.2" fill="#ff8fab"/>
      <circle cx="-4.1" cy="5.7" r="4.2" fill="#ff8fab"/>
      <circle cx="-6.7" cy="-2.2" r="4.2" fill="#ff8fab"/>
      <circle cx="0" cy="0" r="3.6" fill="#ffd93b"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#kimi-k3-max--sky)"/>

  <!-- Sun -->
  <g stroke="#ffca28" stroke-width="5" stroke-linecap="round">
    <line x1="712" y1="95" x2="728" y2="95"/>
    <line x1="608" y1="95" x2="592" y2="95"/>
    <line x1="660" y1="43" x2="660" y2="27"/>
    <line x1="660" y1="147" x2="660" y2="163"/>
    <line x1="697" y1="132" x2="708" y2="143"/>
    <line x1="623" y1="132" x2="612" y2="143"/>
    <line x1="697" y1="58" x2="708" y2="47"/>
    <line x1="623" y1="58" x2="612" y2="47"/>
  </g>
  <circle cx="660" cy="95" r="42" fill="url(#kimi-k3-max--sunGrad)"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="160" cy="92" rx="52" ry="24"/>
    <ellipse cx="122" cy="100" rx="36" ry="18"/>
    <ellipse cx="196" cy="100" rx="38" ry="19"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="430" cy="64" rx="44" ry="20"/>
    <ellipse cx="400" cy="72" rx="32" ry="16"/>
    <ellipse cx="460" cy="72" rx="33" ry="16"/>
  </g>

  <!-- Distant birds -->
  <g stroke="#6b8ba4" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M300 150 q 8 -8 16 0 q 8 -8 16 0"/>
    <path d="M252 186 q 6 -6 12 0 q 6 -6 12 0"/>
  </g>

  <!-- Grass and dirt path -->
  <rect y="460" width="800" height="140" fill="#81c784"/>
  <rect y="505" width="800" height="70" fill="#e9cd9c"/>
  <g fill="#d4b57e">
    <circle cx="100" cy="540" r="4"/>
    <circle cx="300" cy="562" r="3"/>
    <circle cx="520" cy="546" r="4"/>
    <circle cx="700" cy="532" r="3"/>
    <circle cx="640" cy="566" r="3"/>
    <circle cx="200" cy="520" r="3"/>
  </g>
  <use href="#kimi-k3-max--flower" x="60" y="482"/>
  <use href="#kimi-k3-max--flower" x="745" y="480"/>
  <use href="#kimi-k3-max--flower" x="90" y="586"/>
  <use href="#kimi-k3-max--flower" x="640" y="590"/>

  <!-- Speed lines and dust -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <line x1="62" y1="396" x2="158" y2="396"/>
    <line x1="44" y1="430" x2="136" y2="430"/>
    <line x1="74" y1="464" x2="150" y2="464"/>
  </g>
  <g fill="#d9c9a8" opacity="0.7">
    <circle cx="150" cy="522" r="7"/>
    <circle cx="128" cy="534" r="5"/>
    <circle cx="168" cy="538" r="4"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="400" cy="546" rx="235" ry="13" fill="#000000" opacity="0.15"/>

  <!-- Back wheel -->
  <g>
    <circle cx="230" cy="470" r="70" fill="#ffffff" fill-opacity="0.35" stroke="#2b2d42" stroke-width="14"/>
    <circle cx="230" cy="470" r="58" fill="none" stroke="#ced4da" stroke-width="5"/>
    <g stroke="#b0b7bf" stroke-width="3">
      <line x1="230" y1="470" x2="288" y2="470"/>
      <line x1="230" y1="470" x2="172" y2="470"/>
      <line x1="230" y1="470" x2="230" y2="528"/>
      <line x1="230" y1="470" x2="230" y2="412"/>
      <line x1="230" y1="470" x2="271" y2="511"/>
      <line x1="230" y1="470" x2="189" y2="429"/>
      <line x1="230" y1="470" x2="271" y2="429"/>
      <line x1="230" y1="470" x2="189" y2="511"/>
    </g>
    <circle cx="230" cy="470" r="44" fill="none" stroke="#dee2e6" stroke-width="4" stroke-dasharray="14 18"/>
    <circle cx="230" cy="470" r="7" fill="#6c757d"/>
  </g>

  <!-- Front wheel -->
  <g>
    <circle cx="570" cy="470" r="70" fill="#ffffff" fill-opacity="0.35" stroke="#2b2d42" stroke-width="14"/>
    <circle cx="570" cy="470" r="58" fill="none" stroke="#ced4da" stroke-width="5"/>
    <g stroke="#b0b7bf" stroke-width="3">
      <line x1="570" y1="470" x2="628" y2="470"/>
      <line x1="570" y1="470" x2="512" y2="470"/>
      <line x1="570" y1="470" x2="570" y2="528"/>
      <line x1="570" y1="470" x2="570" y2="412"/>
      <line x1="570" y1="470" x2="611" y2="511"/>
      <line x1="570" y1="470" x2="529" y2="429"/>
      <line x1="570" y1="470" x2="611" y2="429"/>
      <line x1="570" y1="470" x2="529" y2="511"/>
    </g>
    <circle cx="570" cy="470" r="44" fill="none" stroke="#dee2e6" stroke-width="4" stroke-dasharray="14 18"/>
    <circle cx="570" cy="470" r="7" fill="#6c757d"/>
  </g>

  <!-- Chain -->
  <g stroke="#868e96" stroke-width="3" fill="none">
    <path d="M395 453 L232 467"/>
    <path d="M395 487 L232 473"/>
  </g>

  <!-- Frame -->
  <g stroke="#e63946" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M395 470 L346 342"/>
    <path d="M346 342 L503 320"/>
    <path d="M520 352 L395 470"/>
    <path d="M395 470 L230 470"/>
    <path d="M346 342 L230 470"/>
    <path d="M520 352 Q 545 410 570 470"/>
  </g>
  <path d="M503 318 L520 352" stroke="#d62839" stroke-width="12" stroke-linecap="round"/>

  <!-- Chainring, cranks, pedals -->
  <circle cx="395" cy="470" r="17" fill="#f1f3f5" stroke="#868e96" stroke-width="5"/>
  <g stroke="#495057" stroke-width="7" stroke-linecap="round">
    <path d="M395 470 L433 508"/>
    <path d="M395 470 L360 445"/>
  </g>
  <rect x="416" y="505" width="38" height="9" rx="3" fill="#343a40"/>
  <rect x="341" y="442" width="38" height="9" rx="3" fill="#343a40"/>

  <!-- Seat -->
  <path d="M348 342 L350 316" stroke="#6c757d" stroke-width="7" stroke-linecap="round"/>
  <path d="M326 314 C 340 304 368 303 386 311 C 388 316 384 319 374 319 L 340 320 C 330 320 324 318 326 314 Z" fill="#343a40"/>

  <!-- Handlebars -->
  <path d="M503 318 L496 284" stroke="#adb5bd" stroke-width="8" stroke-linecap="round"/>
  <path d="M496 284 C 488 276 476 271 462 273" stroke="#adb5bd" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M476 272 L458 276" stroke="#343a40" stroke-width="12" stroke-linecap="round"/>
  <circle cx="492" cy="279" r="5.5" fill="#ffd93b" stroke="#d4a017" stroke-width="1.5"/>

  <!-- ===== PELICAN ===== -->
  <!-- Tail feathers -->
  <path d="M292 258 L244 266 L272 278 L236 288 L270 296 L242 308 L292 300 Z"
        fill="#eef1f4" stroke="#d5dbe1" stroke-width="2" stroke-linejoin="round"/>

  <!-- Scarf tail -->
  <path d="M430 212 C 402 198 370 198 348 211 C 340 215 336 221 338 226 C 364 217 396 219 428 228 Z" fill="#e63946"/>

  <!-- Far leg and foot -->
  <path d="M366 320 C 361 378 357 404 356 428" stroke="#e8893a" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M356 426 C 364 424 372 426 378 430 L 391 436 L 379 440 L 388 445 L 376 447 L 381 452 L 369 450 C 361 445 356 436 356 426 Z"
        fill="#e8893a" stroke="#d37a30" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Body -->
  <path d="M288 252 C 300 216 345 196 390 203 C 430 209 452 240 448 278 C 444 312 415 330 372 331 C 330 332 296 312 288 285 C 286 274 286 262 288 252 Z"
        fill="url(#kimi-k3-max--bodyGrad)" stroke="#d8dee4" stroke-width="2"/>
  <path d="M306 312 C 340 326 394 327 424 312" stroke="#e3e8ec" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Neck and head -->
  <path d="M398 234 C 410 200 424 168 442 148 C 450 139 461 133 474 133 C 488 133 497 141 498 152 C 497 162 489 168 480 171 C 468 185 458 205 449 224 C 443 237 436 248 428 256 Z"
        fill="url(#kimi-k3-max--bodyGrad)" stroke="#d8dee4" stroke-width="2"/>

  <!-- Scarf ring -->
  <path d="M420 204 C 431 197 445 196 454 202 C 457 208 455 214 449 218 C 439 212 429 213 420 220 Z" fill="#d62839"/>

  <!-- Pouch -->
  <path d="M496 155 C 528 149 566 152 598 163 C 590 192 566 210 540 206 C 516 201 501 180 496 155 Z" fill="url(#kimi-k3-max--pouchGrad)"/>

  <!-- Upper beak -->
  <path d="M494 140 C 530 129 570 137 602 158 C 604 161 603 164 599 165 C 568 153 531 149 496 156 Z" fill="url(#kimi-k3-max--beakGrad)"/>
  <path d="M496 156 C 531 149 568 153 598 164" stroke="#e07b39" stroke-width="2" fill="none"/>
  <path d="M515 141 C 545 136 568 142 588 152" stroke="#e07b39" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="600" cy="160" r="2.5" fill="#e07b39"/>

  <!-- Eye -->
  <circle cx="482" cy="145" r="4.5" fill="#212529"/>
  <circle cx="484" cy="143" r="1.5" fill="#ffffff"/>

  <!-- Wing reaching to handlebar -->
  <path d="M405 225 C 435 225 458 242 470 264 C 473 270 471 276 465 277 C 440 272 415 258 403 242 C 400 236 401 229 405 225 Z"
        fill="#f7f9fa" stroke="#d5dbe1" stroke-width="2"/>
  <path d="M422 238 Q 444 248 459 264" stroke="#d5dbe1" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M416 231 Q 440 240 456 257" stroke="#d5dbe1" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Near leg and foot -->
  <path d="M408 320 C 416 390 424 444 428 486" stroke="#ff9f43" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M426 484 C 436 482 446 485 452 489 L 466 495 L 452 499 L 462 505 L 448 507 L 454 513 L 440 510 C 432 503 427 494 426 484 Z"
        fill="#ff9f43" stroke="#e8893a" stroke-width="1.5" stroke-linejoin="round"/>
</svg>