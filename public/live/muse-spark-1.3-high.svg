<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
<title>Pelican riding a bicycle</title>
<desc>A cartoon white pelican with a big orange beak riding a red bicycle</desc>
<rect x="0" y="0" width="800" height="550" rx="24" fill="#CDEFFF"/>
<circle cx="115" cy="95" r="50" fill="#FFE066" stroke="#FFB703" stroke-width="5"/>
<g fill="white" opacity="0.95">
<ellipse cx="340" cy="80" rx="55" ry="22"/>
<ellipse cx="385" cy="68" rx="45" ry="20"/>
<ellipse cx="650" cy="120" rx="60" ry="22"/>
<ellipse cx="695" cy="108" rx="40" ry="18"/>
</g>
<rect x="0" y="420" width="800" height="130" fill="#8FD694"/>
<rect x="0" y="460" width="800" height="90" fill="#59616B"/>
<rect x="0" y="460" width="800" height="8" fill="#7A8591"/>
<line x1="0" y1="505" x2="800" y2="505" stroke="white" stroke-width="6" stroke-dasharray="30 25" opacity="0.9"/>
<g stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.7">
<line x1="60" y1="300" x2="150" y2="300"/>
<line x1="35" y1="332" x2="170" y2="332"/>
<line x1="60" y1="364" x2="150" y2="364"/>
</g>
<!-- WHEELS -->
<g>
<circle cx="220" cy="400" r="62" fill="white" stroke="#222831" stroke-width="14"/>
<g stroke="#9AA0A6" stroke-width="4" stroke-linecap="round">
<line x1="220" y1="344" x2="220" y2="456"/>
<line x1="164" y1="400" x2="276" y2="400"/>
<line x1="180" y1="360" x2="260" y2="440"/>
<line x1="260" y1="360" x2="180" y2="440"/>
</g>
<circle cx="220" cy="400" r="9" fill="#222831"/>
<circle cx="560" cy="400" r="62" fill="white" stroke="#222831" stroke-width="14"/>
<g stroke="#9AA0A6" stroke-width="4" stroke-linecap="round">
<line x1="560" y1="344" x2="560" y2="456"/>
<line x1="504" y1="400" x2="616" y2="400"/>
<line x1="520" y1="360" x2="600" y2="440"/>
<line x1="600" y1="360" x2="520" y2="440"/>
</g>
<circle cx="560" cy="400" r="9" fill="#222831"/>
</g>
<!-- FRAME -->
<g stroke="#E63946" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="220" y1="400" x2="302" y2="272"/>
<line x1="302" y1="272" x2="350" y2="400"/>
<line x1="350" y1="400" x2="220" y2="400"/>
<line x1="302" y1="272" x2="520" y2="272"/>
<line x1="350" y1="400" x2="538" y2="330"/>
<line x1="538" y1="330" x2="560" y2="400"/>
</g>
<g stroke="#9D0208" stroke-width="10" stroke-linecap="round">
<line x1="520" y1="272" x2="540" y2="332"/>
</g>
<!-- handlebar + seat -->
<line x1="520" y1="272" x2="508" y2="210" stroke="#9D0208" stroke-width="8" stroke-linecap="round"/>
<line x1="508" y1="210" x2="546" y2="210" stroke="#ADB5BD" stroke-width="7" stroke-linecap="round"/>
<rect x="534" y="199" width="26" height="16" rx="8" fill="#222831"/>
<ellipse cx="285" cy="260" rx="36" ry="13" fill="#222831"/>
<line x1="295" y1="270" x2="302" y2="272" stroke="#ADB5BD" stroke-width="6"/>
<circle cx="350" cy="400" r="14" fill="#495057" stroke="#222831" stroke-width="4"/>
<line x1="350" y1="400" x2="390" y2="430" stroke="#222831" stroke-width="7" stroke-linecap="round"/>
<line x1="350" y1="400" x2="312" y2="370" stroke="#222831" stroke-width="7" stroke-linecap="round"/>
<rect x="376" y="426" width="30" height="10" rx="3" fill="#222831"/>
<rect x="296" y="366" width="30" height="10" rx="3" fill="#222831"/>

<!-- PELICAN TAIL -->
<path d="M 270 190 L 200 168 L 214 196 L 194 208 L 262 232 Z" fill="#E2E8F0" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>

<!-- PELICAN BODY -->
<ellipse cx="350" cy="200" rx="95" ry="65" fill="white" stroke="#334155" stroke-width="4"/>

<!-- SCARF blowing behind -->
<path d="M 465 155 Q 380 165 330 125 Q 350 170 330 190 Q 380 185 466 175 Z" fill="#E63946" stroke="#7F1D1D" stroke-width="4" stroke-linejoin="round"/>
<circle cx="468" cy="165" r="10" fill="#9D0208"/>

<!-- NECK: dark outline then white -->
<path d="M 420 210 C 450 180 460 150 495 135" fill="none" stroke="#334155" stroke-width="48" stroke-linecap="round"/>
<path d="M 420 210 C 450 180 460 150 495 135" fill="none" stroke="white" stroke-width="38" stroke-linecap="round"/>

<!-- LEGS -->
<path d="M 335 255 L 310 368" fill="none" stroke="#FB8500" stroke-width="13" stroke-linecap="round"/>
<path d="M 365 255 L 390 428" fill="none" stroke="#FB8500" stroke-width="13" stroke-linecap="round"/>
<ellipse cx="308" cy="372" rx="19" ry="9" fill="#FB8500" stroke="#334155" stroke-width="3"/>
<ellipse cx="397" cy="432" rx="20" ry="10" fill="#FB8500" stroke="#334155" stroke-width="3"/>

<!-- WING reaching to handlebar -->
<path d="M 355 185 Q 440 185 516 214 L 506 238 Q 420 222 345 215 Z" fill="#E2E8F0" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
<line x1="400" y1="195" x2="395" y2="214" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
<line x1="430" y1="196" x2="426" y2="217" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

<!-- HEAD -->
<circle cx="510" cy="125" r="32" fill="white" stroke="#334155" stroke-width="4"/>
<!-- Beak pouch -->
<path d="M 538 155 L 678 146 C 670 174 642 205 600 203 C 570 201 550 180 538 155 Z" fill="#FFBF69" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
<!-- Beak top -->
<polygon points="538,113 680,146 538,158" fill="#FF9F1C" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
<!-- Eye -->
<circle cx="518" cy="118" r="7" fill="#111827"/>
<circle cx="520.5" cy="115.5" r="2.5" fill="white"/>
<circle cx="495" cy="135" r="7" fill="#FFC8DD" opacity="0.8"/>
<!-- Helmet -->
<path d="M 478 118 A 33 30 0 0 1 542 118 L 542 106 A 33 26 0 0 0 478 106 Z" fill="#3A86FF" stroke="#1D3557" stroke-width="4"/>
<ellipse cx="510" cy="88" rx="34" ry="14" fill="#3A86FF" stroke="#1D3557" stroke-width="4"/>
<line x1="495" y1="90" x2="495" y2="104" stroke="#1D3557" stroke-width="3"/>
<line x1="510" y1="87" x2="510" y2="102" stroke="#1D3557" stroke-width="3"/>
<line x1="525" y1="90" x2="525" y2="104" stroke="#1D3557" stroke-width="3"/>
</svg>