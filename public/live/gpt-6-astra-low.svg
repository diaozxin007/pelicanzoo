  <circle cx="479" cy="105" r="12" fill="#fff"/>
  <circle cx="483" cy="106" r="6" fill="#273c49"/>
  <circle cx="485" cy="103" r="2" fill="#fff"/>
  <path d="M468 87q10-5 18 0" fill="none" stroke="#273c49" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Near leg, webbed foot, and crank -->
  <path d="m367 302-20 49 35 90" fill="none" stroke="#273c49" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m367 302-20 49 35 90" fill="none" stroke="#f3ad49" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m380 435 37 23-52-1 7-12Z" fill="#ffba51" stroke="#273c49" stroke-width="4" stroke-linejoin="round"/>
  <path d="m402 426-15 39m-20 0h43" fill="none" stroke="#273c49" stroke-width="7" stroke-linecap="round"/>

  <!-- A few motion marks -->
  <g fill="none" stroke="#83bfc6" stroke-width="5" stroke-linecap="round">
    <path d="M86 343h54M67 366h45M99 390h24"/>
  </g>
</svg>