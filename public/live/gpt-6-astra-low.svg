  <!-- Wing tip reaching the handlebar -->
  <path d="M400 240q49 0 77-8l73-4q13 0 15 8-7 10-22 9l-64 8q-35 20-62 12"
        fill="#fffdf4" stroke="#273c49" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pelican pouch and long bill -->
  <path d="M496 126 690 135
           C655 165 602 192 559 186
