  <path d="M458 111c38 9 88 13 128 10" fill="none" stroke="#b95f48" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="437" cy="99" r="5.5" fill="#284752"/>
  <circle cx="439" cy="97" r="1.7" fill="#fffdf6"/>
  <path d="M418 84l-5-7m14 5-1-9m9 11 4-7" fill="none" class="ink" stroke-width="2.5"/>

  <!-- Folded, reaching wing -->
  <path d="M382 215c21-18 42-10 62 12l48 51c7 7 10 13 4 19-6 6-13 2-19-4l-43-39c-10 19-31 24-50 10 13-14 15-32-2-49z"
        fill="#f1e8d6" class="ink" stroke-width="4"/>
  <path d="M407 224c10 13 22 25 35 35m-48-30c9 14 19 26 31 36m-11-42 29 29"
        fill="none" stroke="#d8cdb9" stroke-width="3" stroke-linecap="round"/>

  <!-- Legs and webbed feet -->
  <g fill="none" stroke="#284752" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M365 278q25 19 48 40l13 88"/>
    <path d="M390 278q-24 22-46 43l21 140"/>
  </g>
  <g fill="none" stroke="#ed9b4c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M365 278q25 19 48 40l13 88"/>
    <path d="M390 278q-24 22-46 43l21 140"/>
  </g>
  <circle cx="413" cy="318" r="6" fill="#ed9b4c" stroke="#284752" stroke-width="2"/>
  <circle cx="344" cy="321" r="6" fill="#ed9b4c" stroke="#284752" stroke-width="2"/>
  <path d="M423 403q12-8 25-2l8 5q-11 8-31 8l-7 1z" fill="#ed9b4c" class="ink" stroke-width="3"/>
  <path d="M367 463q-12-8-25-3l-9 5q10 9 30 10l8 1z" fill="#ed9b4c" class="ink" stroke-width="3"/>

