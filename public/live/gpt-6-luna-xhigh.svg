    <circle cx="560" cy="438" r="99" stroke-width="12"/>
    <circle cx="240" cy="438" r="92" stroke="#68b7b0" stroke-width="3"/>
    <circle cx="560" cy="438" r="92" stroke="#68b7b0" stroke-width="3"/>
  </g>

