<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="gpt-6-luna-xhigh--title">Pelican riding a bicycle</title>
  <desc id="gpt-6-luna-xhigh--desc">A cheerful pelican pedals a teal bicycle beneath a warm afternoon sun.</desc>

  <defs>
    <linearGradient id="gpt-6-luna-xhigh--sky" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9e9"/>
      <stop offset="1" stop-color="#e8f4ed"/>
    </linearGradient>
    <linearGradient id="gpt-6-luna-xhigh--feathers" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#eee5d2"/>
    </linearGradient>
    <style>
      .ink { stroke: #284752; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #afc5c1; stroke-width: 2; }
      .frame { fill: none; stroke: #329b98; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Soft, sunny background -->
  <rect width="800" height="600" fill="url(#gpt-6-luna-xhigh--sky)"/>
  <circle cx="685" cy="93" r="43" fill="#f5c96c"/>
  <circle cx="685" cy="93" r="54" fill="none" stroke="#f5c96c" stroke-opacity=".2" stroke-width="8"/>
  <g fill="#fffdf6" opacity=".9">
    <path d="M93 151c2-13 13-22 27-22 11 0 20 6 24 15 4-3 9-5 15-5 13 0 23 9 24 21H94c-7 0-11-4-11-9 0-6 4-10 10-10z"/>
    <path d="M629 226c2-10 11-17 21-17 9 0 16 5 19 12 4-3 8-4 12-4 10 0 18 7 19 16h-71c-5 0-8-3-8-7 0-5 3-8 8-8z"/>
  </g>
  <path d="M0 383c120-34 211-17 317 4 116 23 210-17 483-3v170H0z" fill="#dceee0"/>
  <path d="M0 433c159-24 247 9 383 8 146-1 262-33 417-11v122H0z" fill="#c9e4d2"/>
  <ellipse cx="402" cy="541" rx="290" ry="13" fill="#63857d" opacity=".14"/>
  <path d="M45 542h710" stroke="#8eb4a3" stroke-width="3" stroke-linecap="round"/>

  <!-- Bicycle wheels -->
  <g class="spoke">
    <g>
      <line x1="240" y1="438" x2="240" y2="342"/>
      <line x1="240" y1="438" x2="240" y2="342" transform="rotate(30 240 438)"/>
      <line x1="240" y1="438" x2="240" y2="342" transform="rotate(60 240 438)"/>
      <line x1="240" y1="438" x2="240" y2="342" transform="rotate(90 240 438)"/>
      <line x1="240" y1="438" x2="240" y2="342" transform="rotate(120 240 438)"/>
      <line x1="240" y1="438" x2="240" y2="342" transform="rotate(150 240 438)"/>
      <line x1="240" y1="438" x2="240" y2="342" transform="rotate(180 240 438)"/>
      <line x1="240" y1="438" x2="240" y2="342" transform="rotate(210 240 438)"/>
      <line x1="240" y1="438" x2="240" y2="342" transform="rotate(240 240 438)"/>
      <line x1="240" y1="438" x2="240" y2="342" transform="rotate(270 240 438)"/>
      <line x1="240" y1="438" x2="240" y2="342" transform="rotate(300 240 438)"/>
      <line x1="240" y1="438" x2="240" y2="342" transform="rotate(330 240 438)"/>
    </g>
    <g>
      <line x1="560" y1="438" x2="560" y2="342"/>
      <line x1="560" y1="438" x2="560" y2="342" transform="rotate(30 560 438)"/>
      <line x1="560" y1="438" x2="560" y2="342" transform="rotate(60 560 438)"/>
      <line x1="560" y1="438" x2="560" y2="342" transform="rotate(90 560 438)"/>
      <line x1="560" y1="438" x2="560" y2="342" transform="rotate(120 560 438)"/>
      <line x1="560" y1="438" x2="560" y2="342" transform="rotate(150 560 438)"/>
      <line x1="560" y1="438" x2="560" y2="342" transform="rotate(180 560 438)"/>
      <line x1="560" y1="438" x2="560" y2="342" transform="rotate(210 560 438)"/>
      <line x1="560" y1="438" x2="560" y2="342" transform="rotate(240 560 438)"/>
      <line x1="560" y1="438" x2="560" y2="342" transform="rotate(270 560 438)"/>
      <line x1="560" y1="438" x2="560" y2="342" transform="rotate(300 560 438)"/>
      <line x1="560" y1="438" x2="560" y2="342" transform="rotate(330 560 438)"/>
    </g>
  </g>
  <g fill="none" class="ink">
