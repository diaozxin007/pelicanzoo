  <!-- Pelican body -->
  <ellipse cx="370" cy="244" rx="77" ry="59" fill="url(#gpt-6-luna-xhigh--feathers)" class="ink" stroke-width="4"/>
  <path d="M318 242c18-28 51-43 84-34" fill="none" stroke="#e1d7c4" stroke-width="3" stroke-linecap="round"/>

  <!-- Head and bill -->
  <ellipse cx="431" cy="103" rx="20" ry="18" fill="url(#gpt-6-luna-xhigh--feathers)" class="ink" stroke-width="4"/>
  <path d="M444 103c35 7 91 9 151 11-12 25-31 44-55 47-25 3-49-13-68-31-12-11-21-17-28-18z"
        fill="#e9875c" class="ink" stroke-width="3"/>
  <path d="M445 94c39-5 101 4 157 16 6 1 6 6 0 8-51 3-111-3-157-11z"
