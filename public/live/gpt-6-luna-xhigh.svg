  <g class="frame">
    <path d="M240 438 355 325 480 326 395 438 240 438"/>
    <path d="M355 325 395 438"/>
    <path d="M480 326 560 438"/>
  </g>
  <path d="M474 319l15 4-7 28-15-4z" fill="#f1bd59" class="ink" stroke-width="3"/>
  <path d="M482 321l12-39 10 3-8 40" fill="none" stroke="#329b98" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M489 282c8-8 17-10 27-9l18 2" fill="none" stroke="#284752" stroke-width="7" stroke-linecap="round"/>
  <path d="M527 274l9 1" stroke="#e78358" stroke-width="9" stroke-linecap="round"/>
  <path d="M355 325l-3-17" stroke="#284752" stroke-width="7" stroke-linecap="round"/>
  <path d="M331 307c13-5 28-4 41 2l-3 8c-14-2-26-1-39 1z" fill="#e78358" class="ink" stroke-width="3"/>
  <path d="M240 438 395 438" fill="none" stroke="#d1a14f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="395" cy="438" r="20" fill="none" stroke="#284752" stroke-width="4"/>
  <circle cx="395" cy="438" r="6" fill="#f1bd59" class="ink" stroke-width="2"/>
  <path d="M395 438l30-30M395 438l-30 30" fill="none" stroke="#284752" stroke-width="7" stroke-linecap="round"/>
  <path d="M416 410h19M355 470h19" stroke="#284752" stroke-width="7" stroke-linecap="round"/>
  <circle cx="240" cy="438" r="8" fill="#f1bd59" class="ink" stroke-width="3"/>
  <circle cx="560" cy="438" r="8" fill="#f1bd59" class="ink" stroke-width="3"/>

