<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mistral-large-4-none--skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F6FF"/>
    </linearGradient>
    <linearGradient id="mistral-large-4-none--bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <linearGradient id="mistral-large-4-none--beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="mistral-large-4-none--pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB6C1"/>
      <stop offset="100%" stop-color="#FF69B4"/>
    </linearGradient>
    <radialGradient id="mistral-large-4-none--wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="80%" stop-color="#D3D3D3"/>
      <stop offset="100%" stop-color="#A9A9A9"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="url(#mistral-large-4-none--skyGrad)"/>

  <!-- Sun -->
  <circle cx="520" cy="70" r="40" fill="#FFE066" opacity="0.9"/>
  <circle cx="520" cy="70" r="50" fill="#FFE066" opacity="0.3"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="120" cy="80" rx="45" ry="20"/>
    <ellipse cx="150" cy="70" rx="35" ry="18"/>
    <ellipse cx="90" cy="70" rx="30" ry="15"/>
    <ellipse cx="400" cy="120" rx="40" ry="18"/>
    <ellipse cx="430" cy="110" rx="30" ry="15"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="380" width="600" height="120" fill="#8FBC8F"/>
  <rect x="0" y="380" width="600" height="10" fill="#7BAF7B"/>

  <!-- Road -->
  <rect x="0" y="400" width="600" height="60" fill="#696969"/>
  <rect x="0" y="425" width="600" height="8" fill="#FFD700" stroke-dasharray="30,20" stroke-width="4"/>

  <!-- Motion lines -->
  <g stroke="#B0C4DE" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="50" y1="200" x2="110" y2="200"/>
    <line x1="30" y1="230" x2="100" y2="230"/>
    <line x1="60" y1="260" x2="110" y2="260"/>
  </g>

  <!-- ===== BICYCLE ===== -->
  <g id="mistral-large-4-none--bicycle">
    <!-- Back wheel -->
    <g transform="translate(180, 350)">
      <circle r="55" fill="url(#mistral-large-4-none--wheelGrad)" stroke="#333" stroke-width="4"/>
      <circle r="45" fill="none" stroke="#666" stroke-width="2"/>
      <g stroke="#888" stroke-width="2">
        <line x1="0" y1="-45" x2="0" y2="45"/>
        <line x1="-45" y1="0" x2="45" y2="0"/>
        <line x1="-32" y1="-32" x2="32" y2="32"/>
        <line x1="-32" y1="32" x2="32" y2="-32"/>
        <line x1="-17" y1="-42" x2="17" y2="42"/>
        <line x1="17" y1="-42" x2="-17" y2="42"/>
      </g>
      <circle r="8" fill="#444"/>
    </g>

    <!-- Front wheel -->
    <g transform="translate(420, 350)">
      <circle r="55" fill="url(#mistral-large-4-none--wheelGrad)" stroke="#333" stroke-width="4"/>
      <circle r="45" fill="none" stroke="#666" stroke-width="2"/>
      <g stroke="#888" stroke-width="2">
        <line x1="0" y1="-45" x2="0" y2="45"/>
        <line x1="-45" y1="0" x2="45" y2="0"/>
        <line x1="-32" y1="-32" x2="32" y2="32"/>
        <line x1="-32" y1="32" x2="32" y2="-32"/>
        <line x1="-17" y1="-42" x2="17" y2="42"/>
        <line x1="17" y1="-42" x2="-17" y2="42"/>
      </g>
      <circle r="8" fill="#444"/>
    </g>

    <!-- Frame -->
    <g stroke="#E74C3C" stroke-width="8" stroke-linecap="round" fill="none">
      <!-- Main triangle -->
      <line x1="180" y1="350" x2="280" y2="350"/> <!-- chain stay -->
      <line x1="280" y1="350" x2="350" y2="250"/> <!-- seat tube -->
      <line x1="180" y1="350" x2="350" y2="250"/> <!-- down tube -->
      <line x1="350" y1="250" x2="420" y2="350"/> <!-- top tube to head -->
      <line x1="420" y1="350" x2="380" y2="240"/> <!-- fork -->
    </g>

    <!-- Seat -->
    <g transform="translate(340, 245)">
      <ellipse rx="28" ry="10" fill="#8B4513" stroke="#5D3A1A" stroke-width="2"/>
    </g>

    <!-- Handlebars -->
    <g stroke="#333" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="380" y1="240" x2="395" y2="210"/>
      <line x1="395" y1="210" x2="420" y2="205"/>
      <line x1="395" y1="210" x2="375" y2="200"/>
    </g>
    <circle cx="420" cy="205" r="6" fill="#333"/>
    <circle cx="375" cy="200" r="6" fill="#333"/>

    <!-- Pedals and crank -->
    <g transform="translate(280, 350)">
      <circle r="12" fill="#555" stroke="#333" stroke-width="2"/>
      <line x1="0" y1="0" x2="25" y2="-20" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-25" y2="20" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <rect x="18" y="-28" width="20" height="8" rx="3" fill="#222"/>
      <rect x="-38" y="16" width="20" height="8" rx="3" fill="#222"/>
    </g>

    <!-- Chain -->
    <path d="M 180 350 L 280 350 L 280 338 L 180 338 Z" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="4,2"/>
  </g>

  <!-- ===== PELICAN ===== -->
  <g id="mistral-large-4-none--pelican">
    <!-- Back leg (pedaling) -->
    <path d="M 290 280 Q 270 320 280 350 L 295 355 Q 285 325 305 295 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>

    <!-- Front leg (pedaling) -->
    <path d="M 310 285 Q 330 310 305 335 L 290 328 Q 310 305 295 290 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>

    <!-- Feet on pedals -->
    <ellipse cx="305" cy="332" rx="12" ry="6" fill="#FF8C00"/>
    <ellipse cx="282" cy="358" rx="12" ry="6" fill="#FF8C00"/>

    <!-- Tail feathers -->
    <path d="M 220 220 Q 180 200 160 220 Q 180 240 220 240 Z" fill="#F0F0F0" stroke="#CCC" stroke-width="2"/>

    <!-- Body -->
    <ellipse cx="280" cy="230" rx="65" ry="55" fill="url(#mistral-large-4-none--bodyGrad)" stroke="#D3D3D3" stroke-width="2" transform="rotate(-15 280 230)"/>

    <!-- Wing -->
    <path d="M 250 200 Q 300 180 340 210 Q 320 250 270 250 Q 240 230 250 200 Z" fill="#E8E8E8" stroke="#CCC" stroke-width="2"/>
    <path d="M 260 210 Q 300 195 330 215" fill="none" stroke="#BBB" stroke-width="2"/>
    <path d="M 265 225 Q 295 212 325 225" fill="none" stroke="#BBB" stroke-width="2"/>

    <!-- Wing tip reaching handlebar -->
    <path d="M 335 215 Q 370 210 395 205 Q 380 220 345 230 Z" fill="#E0E0E0" stroke="#CCC" stroke-width="2"/>

    <!-- Neck -->
    <path d="M 320 200 Q 340 160 350 130 Q 355 115 370 110 L 380 125 Q 365 135 360 155 Q 350 185 335 215 Z" fill="url(#mistral-large-4-none--bodyGrad)" stroke="#D3D3D3" stroke-width="2"/>

    <!-- Head -->
    <circle cx="385" cy="115" r="28" fill="url(#mistral-large-4-none--bodyGrad)" stroke="#D3D3D3" stroke-width="2"/>

    <!-- Head crest -->
    <path d="M 365 95 Q 355 80 345 85 Q 355 90 360 100 Z" fill="#F0F0F0" stroke="#DDD" stroke-width="1"/>
    <path d="M 375 90 Q 370 72 358 75 Q 370 82 372 95 Z" fill="#F0F0F0" stroke="#DDD" stroke-width="1"/>

    <!-- Eye -->
    <circle cx="392" cy="108" r="5" fill="#333"/>
    <circle cx="394" cy="106" r="1.5" fill="#FFF"/>

    <!-- Beak (upper) -->
    <path d="M 408 105 Q 480 110 510 125 Q 480 135 410 125 Q 405 115 408 105 Z" fill="url(#mistral-large-4-none--beakGrad)" stroke="#FF8C00" stroke-width="2"/>

    <!-- Pouch -->
    <path d="M 410 125 Q 460 135 505 128 Q 490 165 440 160 Q 415 150 410 125 Z" fill="url(#mistral-large-4-none--pouchGrad)" stroke="#FF69B4" stroke-width="2"/>
    <path d="M 420 135 Q 450 145 490 138" fill="none" stroke="#FF85C1" stroke-width="2"/>

    <!-- Beak tip -->
    <path d="M 505 122 Q 515 125 510 130 Q 505 128 500 127 Z" fill="#FF8C00"/>

    <!-- Neck ring/feather detail -->
    <path d="M 340 185 Q 355 195 370 190" fill="none" stroke="#DDD" stroke-width="2"/>
  </g>

  <!-- Speed dust behind back wheel -->
  <g fill="#D2B48C" opacity="0.5">
    <circle cx="100" cy="380" r="8"/>
    <circle cx="80" cy="390" r="6"/>
    <circle cx="115" cy="395" r="5"/>
    <circle cx="65" cy="375" r="4"/>
  </g>

  <!-- Small flowers on ground -->
  <g>
    <circle cx="80" cy="450" r="4" fill="#FF69B4"/>
    <circle cx="80" cy="450" r="2" fill="#FFD700"/>
    <circle cx="520" cy="470" r="4" fill="#FF69B4"/>
    <circle cx="520" cy="470" r="2" fill="#FFD700"/>
    <circle cx="300" cy="480" r="4" fill="#FF69B4"/>
    <circle cx="300" cy="480" r="2" fill="#FFD700"/>
  </g>
</svg>