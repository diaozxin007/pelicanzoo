<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="deepseek-v4.1-flash-1017-max--title">Pelican Riding a Bicycle</title>
  <desc id="deepseek-v4.1-flash-1017-max--desc">A cartoon pelican with a large orange beak riding a red bicycle along a sunny path.</desc>
  <defs>
    <linearGradient id="deepseek-v4.1-flash-1017-max--skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9ddff"/>
      <stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
    <linearGradient id="deepseek-v4.1-flash-1017-max--groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed36a"/>
      <stop offset="1" stop-color="#4ea63c"/>
    </linearGradient>
    <radialGradient id="deepseek-v4.1-flash-1017-max--bodyGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f5f0"/>
      <stop offset="1" stop-color="#dde1d8"/>
    </radialGradient>
    <linearGradient id="deepseek-v4.1-flash-1017-max--neckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfa"/>
      <stop offset="1" stop-color="#e8ebe2"/>
    </linearGradient>
    <linearGradient id="deepseek-v4.1-flash-1017-max--beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd79a"/>
      <stop offset="1" stop-color="#ffbe72"/>
    </linearGradient>
    <linearGradient id="deepseek-v4.1-flash-1017-max--pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe72"/>
      <stop offset="1" stop-color="#e2762f"/>
    </linearGradient>
    <radialGradient id="deepseek-v4.1-flash-1017-max--sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#deepseek-v4.1-flash-1017-max--skyGrad)"/>
  <circle cx="688" cy="92" r="110" fill="url(#deepseek-v4.1-flash-1017-max--sunGlow)"/>
  <circle cx="688" cy="92" r="48" fill="#ffe066"/>

  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="104" rx="62" ry="30"/>
    <ellipse cx="200" cy="94" rx="46" ry="26"/>
    <ellipse cx="104" cy="96" rx="38" ry="22"/>
  </g>
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="556" cy="72" rx="48" ry="23"/>
    <ellipse cx="598" cy="62" rx="34" ry="18"/>
  </g>

  <path d="M0 522 Q 200 500 420 512 T 800 506 L 800 600 L 0 600 Z" fill="url(#deepseek-v4.1-flash-1017-max--groundGrad)"/>

  <ellipse cx="425" cy="516" rx="240" ry="16" fill="#2f6b22" opacity="0.25"/>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <line x1="58" y1="196" x2="150" y2="196"/>
    <line x1="28" y1="248" x2="112" y2="248"/>
    <line x1="66" y1="300" x2="140" y2="300"/>
  </g>

  <!-- Far leg (behind the bike) -->
  <g>
    <line x1="415" y1="430" x2="382" y2="402" stroke="#3a3a3a" stroke-width="8" stroke-linecap="round"/>
    <rect x="368" y="396" width="28" height="9" rx="4" fill="#2f3640"/>
    <g stroke="#c97a35" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M382 398 L 402 392"/>
      <path d="M382 398 L 404 400"/>
      <path d="M382 398 L 400 408"/>
    </g>
    <polyline points="340,305 352,345 382,398" fill="none" stroke="#c97a35" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bicycle -->
  <g>
    <!-- rear wheel -->
    <circle cx="270" cy="430" r="75" fill="none" stroke="#2b2b2b" stroke-width="13"/>
    <circle cx="270" cy="430" r="63" fill="none" stroke="#cfd6dd" stroke-width="5"/>
    <g transform="translate(270,430)" stroke="#b7c0c9" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-63" x2="0" y2="63"/>
      <line x1="0" y1="-63" x2="0" y2="63" transform="rotate(30)"/>
      <line x1="0" y1="-63" x2="0" y2="63" transform="rotate(60)"/>
      <line x1="0" y1="-63" x2="0" y2="63" transform="rotate(90)"/>
      <line x1="0" y1="-63" x2="0" y2="63" transform="rotate(120)"/>
      <line x1="0" y1="-63" x2="0" y2="63" transform="rotate(150)"/>
    </g>
    <circle cx="270" cy="430" r="9" fill="#6b7280"/>

    <!-- front wheel -->
    <circle cx="580" cy="430" r="75" fill="none" stroke="#2b2b2b" stroke-width="13"/>
    <circle cx="580" cy="430" r="63" fill="none" stroke="#cfd6dd" stroke-width="5"/>
    <g transform="translate(580,430)" stroke="#b7c0c9" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-63" x2="0" y2="63"/>
      <line x1="0" y1="-63" x2="0" y2="63" transform="rotate(30)"/>
      <line x1="0" y1="-63" x2="0" y2="63" transform="rotate(60)"/>
      <line x1="0" y1="-63" x2="0" y2="63" transform="rotate(90)"/>
      <line x1="0" y1="-63" x2="0" y2="63" transform="rotate(120)"/>
      <line x1="0" y1="-63" x2="0" y2="63" transform="rotate(150)"/>
    </g>
    <circle cx="580" cy="430" r="9" fill="#6b7280"/>

    <!-- frame -->
    <g stroke="#e63946" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M270 430 L415 430"/>
      <path d="M270 430 L325 320"/>
      <path d="M415 430 L325 320"/>
      <path d="M415 430 L540 385"/>
      <path d="M325 320 L550 330"/>
      <path d="M550 330 L540 385"/>
      <path d="M540 385 L580 430"/>
    </g>

    <!-- chain and gears -->
    <path d="M415 404 L270 418 M415 456 L270 442" stroke="#5b6470" stroke-width="4" stroke-dasharray="5 4"/>
    <circle cx="415" cy="430" r="26" fill="none" stroke="#5b6470" stroke-width="5"/>
    <circle cx="270" cy="430" r="12" fill="none" stroke="#5b6470" stroke-width="4"/>
    <circle cx="415" cy="430" r="7" fill="#5b6470"/>

    <!-- near crank and pedal -->
    <line x1="415" y1="430" x2="450" y2="458" stroke="#555" stroke-width="8" stroke-linecap="round"/>
    <rect x="436" y="452" width="28" height="9" rx="4" fill="#2f3640"/>

    <!-- saddle -->
    <path d="M286 322 Q 294 304 320 304 Q 352 304 360 318 Q 348 332 316 332 Q 294 332 286 322 Z" fill="#2f3640"/>

    <!-- handlebar -->
    <g stroke="#4b5563" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M550 330 L556 300"/>
      <path d="M556 300 Q 558 282 578 280 L 600 284"/>
    </g>
    <path d="M588 281 L 606 286" stroke="#1f2937" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Near leg -->
  <g>
    <g stroke="#e08a3c" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M448 450 L 470 444"/>
      <path d="M448 450 L 472 452"/>
      <path d="M448 450 L 468 460"/>
    </g>
    <polyline points="356,303 380,350 448,450" fill="none" stroke="#e08a3c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pelican -->
  <g>
    <!-- tail -->
    <path d="M268 214 L196 192 L214 222 L184 230 L218 250 L262 262 Z" fill="#e6eae2" stroke="#cdd3c9" stroke-width="2" stroke-linejoin="round"/>

    <!-- neck -->
    <path d="M366 240 C 372 165 420 132 470 138" fill="none" stroke="url(#deepseek-v4.1-flash-1017-max--neckGrad)" stroke-width="48" stroke-linecap="round"/>

    <!-- body -->
    <ellipse cx="330" cy="238" rx="86" ry="68" fill="url(#deepseek-v4.1-flash-1017-max--bodyGrad)"/>
    <ellipse cx="330" cy="238" rx="86" ry="68" fill="none" stroke="#d5d9cf" stroke-width="2.5"/>

    <!-- beak pouch -->
    <path d="M492 152 C 560 158 640 168 692 176 C 686 214 630 242 572 236 C 532 232 506 208 492 172 Z" fill="url(#deepseek-v4.1-flash-1017-max--pouchGrad)"/>

    <!-- upper mandible -->
    <path d="M492 118 C 580 126 650 148 692 176 C 640 168 560 158 492 152 Z" fill="url(#deepseek-v4.1-flash-1017-max--beakGrad)"/>

    <!-- mouth line -->
    <path d="M492 152 C 560 158 640 168 692 176" fill="none" stroke="#c96a2e" stroke-width="3" stroke-linecap="round"/>

    <!-- nostril detail -->
    <path d="M532 132 C 562 136 592 142 620 149" fill="none" stroke="#e09a4e" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- head -->
    <circle cx="485" cy="145" r="34" fill="url(#deepseek-v4.1-flash-1017-max--bodyGrad)"/>
    <circle cx="485" cy="145" r="34" fill="none" stroke="#d5d9cf" stroke-width="2.5"/>

    <!-- eye -->
    <circle cx="500" cy="136" r="7" fill="#1f2937"/>
    <circle cx="502.5" cy="133.5" r="2.5" fill="#ffffff"/>

    <!-- wing -->
    <path d="M352 188 C 436 196 520 234 598 280 C 608 286 600 302 586 296 C 508 268 434 262 376 274 C 346 260 336 208 352 188 Z" fill="#eef1ec" stroke="#d3d8d2" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#d8ddd6" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M396 226 C 448 240 500 260 540 280"/>
      <path d="M386 250 C 436 260 488 274 528 290"/>
    </g>
  </g>
</svg>