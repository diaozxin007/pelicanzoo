    <path d="M367 113 Q385 134 412 135" fill="none" stroke="#e6a05b" stroke-width="3"/>
    <circle cx="340" cy="86" r="5" fill="#263e48"/>
    <circle cx="341.5" cy="84.5" r="1.5" fill="white"/>

    <!-- Knotted scarf and a wing resting on the handlebar -->
    <path d="M288 141 Q304 149 324 141 L326 151 Q306 162 283 151Z" fill="#e46956" stroke="#a84e44" stroke-width="2"/>
    <path d="M248 171 Q263 161 281 170 Q310 187 338 188
