<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="claude-fable-5.2-high--sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e0f6ff"/>
    </linearGradient>
    <g id="claude-fable-5.2-high--spokes" stroke="#9aa0a6" stroke-width="2">
      <line x1="-94" y1="0" x2="94" y2="0"/>
      <line x1="-94" y1="0" x2="94" y2="0" transform="rotate(30)"/>
      <line x1="-94" y1="0" x2="94" y2="0" transform="rotate(60)"/>
      <line x1="-94" y1="0" x2="94" y2="0" transform="rotate(90)"/>
      <line x1="-94" y1="0" x2="94" y2="0" transform="rotate(120)"/>
      <line x1="-94" y1="0" x2="94" y2="0" transform="rotate(150)"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#claude-fable-5.2-high--sky)"/>
  <circle cx="690" cy="90" r="45" fill="#ffe066"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="100" rx="60" ry="22"/>
    <ellipse cx="190" cy="85" rx="40" ry="20"/>
    <ellipse cx="560" cy="60" rx="50" ry="16"/>
  </g>
  <rect y="540" width="800" height="60" fill="#8bc34a"/>
  <rect y="540" width="800" height="8" fill="#7cb342"/>
  <ellipse cx="400" cy="548" rx="260" ry="10" fill="#000" opacity="0.15"/>

  <!-- Far leg and far pedal (behind bike) -->
  <g stroke="#c9751a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="350,292 396,345 362,404"/>
  </g>
  <path d="M342 404 L384 400 L380 414 L346 416 Z" fill="#c9751a"/>
  <line x1="390" y1="440" x2="362" y2="412" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <rect x="345" y="408" width="34" height="8" rx="3" fill="#333"/>

  <!-- Wheels -->
  <g transform="translate(230 440)">
    <use href="#claude-fable-5.2-high--spokes"/>
    <circle r="97" fill="none" stroke="#2b2b2b" stroke-width="10"/>
    <circle r="89" fill="none" stroke="#c7ccd1" stroke-width="3"/>
    <circle r="8" fill="#555"/>
  </g>
  <g transform="translate(570 440)">
    <use href="#claude-fable-5.2-high--spokes"/>
    <circle r="97" fill="none" stroke="#2b2b2b" stroke-width="10"/>
    <circle r="89" fill="none" stroke="#c7ccd1" stroke-width="3"/>
    <circle r="8" fill="#555"/>
  </g>

  <!-- Bicycle frame -->
  <g stroke="#d63b3b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="350" y1="312" x2="390" y2="440"/>
    <line x1="354" y1="325" x2="514" y2="295"/>
    <line x1="521" y1="314" x2="390" y2="440"/>
    <line x1="390" y1="440" x2="230" y2="440"/>
    <line x1="354" y1="325" x2="230" y2="440"/>
    <line x1="506" y1="272" x2="523" y2="318"/>
    <line x1="523" y1="318" x2="570" y2="440"/>
  </g>
  <!-- Stem and handlebar -->
  <line x1="506" y1="272" x2="502" y2="260" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <path d="M484 257 L522 262 Q540 264 536 280" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <line x1="480" y1="256" x2="496" y2="258" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <!-- Seat -->
  <path d="M318 304 Q345 296 382 304 Q384 314 360 314 L330 314 Q316 314 318 304 Z" fill="#2b2b2b"/>

  <!-- Chain and chainring -->
  <line x1="230" y1="432" x2="390" y2="418" stroke="#444" stroke-width="2"/>
  <line x1="230" y1="448" x2="390" y2="462" stroke="#444" stroke-width="2"/>
  <circle cx="390" cy="440" r="22" fill="#ddd" stroke="#555" stroke-width="4"/>
  <circle cx="390" cy="440" r="6" fill="#555"/>

  <!-- Near crank and pedal -->
  <line x1="390" y1="440" x2="420" y2="470" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <rect x="402" y="468" width="38" height="8" rx="3" fill="#333"/>

  <!-- Pelican -->
  <!-- Tail -->
  <path d="M268 235 L222 232 L246 252 L218 264 L262 272 Z" fill="#fff" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Neck outline -->
  <path d="M395 215 C445 190 395 155 440 115" fill="none" stroke="#333" stroke-width="42" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="340" cy="238" rx="96" ry="66" transform="rotate(-14 340 238)" fill="#fff" stroke="#333" stroke-width="3"/>
  <path d="M262 270 Q330 310 410 262 Q350 290 262 270 Z" fill="#e3e7ea"/>
  <!-- Neck fill -->
  <path d="M395 215 C445 190 395 155 440 115" fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round"/>

  <!-- Beak -->
  <path d="M466 116 Q496 196 560 166 Q592 152 607 143 Z" fill="#ffd166" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <path d="M462 92 L608 132 Q618 144 606 144 L466 118 Z" fill="#f59e1b" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="445" cy="108" r="29" fill="#fff" stroke="#333" stroke-width="3"/>
  <path d="M428 84 Q415 62 400 66 Q414 72 418 92 Z" fill="#fff" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <path d="M462 92 L470 104 L466 118 Q456 106 462 92 Z" fill="#f59e1b"/>
  <circle cx="453" cy="100" r="6.5" fill="#222"/>
  <circle cx="455" cy="98" r="2.2" fill="#fff"/>

  <!-- Wing reaching to handlebar -->
  <path d="M330 205 Q420 195 492 254 Q498 262 486 264 Q420 290 340 270 Q300 250 330 205 Z" fill="#fff" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <path d="M440 262 Q470 262 492 256 Q496 262 486 264 Q462 274 436 277 Z" fill="#555"/>
  <path d="M350 240 Q390 256 430 250 M345 254 Q385 270 425 264" fill="none" stroke="#c5cbd0" stroke-width="3" stroke-linecap="round"/>

  <!-- Near leg and foot -->
  <g stroke="#f59e1b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="368,296 428,372 420,460"/>
  </g>
  <path d="M400 458 L448 454 L444 468 L404 470 Z" fill="#f59e1b" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
</svg>