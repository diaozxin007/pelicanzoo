<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="gpt-6.2-astra-xhigh--title">The pelican’s morning ride</title>
  <desc id="gpt-6.2-astra-xhigh--desc">A white pelican with a golden bill and a fluttering red scarf pedals a teal bicycle along the seaside.</desc>

  <defs>
    <linearGradient id="gpt-6.2-astra-xhigh--sky" x2="0" y2="1">
      <stop stop-color="#e6f3ed"/>
      <stop offset="1" stop-color="#fff4db"/>
    </linearGradient>
    <linearGradient id="gpt-6.2-astra-xhigh--pouch" x2=".2" y2="1">
      <stop stop-color="#ffd478"/>
      <stop offset="1" stop-color="#f09a49"/>
    </linearGradient>
    <g id="gpt-6.2-astra-xhigh--wheel">
      <circle r="87" fill="none" stroke="#243d40" stroke-width="12"/>
      <circle r="82" fill="none" stroke="#f5e8c8" stroke-width="4"/>
      <g fill="none" stroke="#819b96" stroke-width="1.7">
        <path d="M-80 0H80 M0-80V80 M-56.6-56.6 56.6 56.6 M-56.6 56.6 56.6-56.6"/>
        <path d="M-80 0H80 M0-80V80 M-56.6-56.6 56.6 56.6 M-56.6 56.6 56.6-56.6" transform="rotate(22.5)"/>
      </g>
      <circle r="8" fill="#e5d4ac" stroke="#243d40" stroke-width="3"/>
    </g>
  </defs>

  <!-- Seaside promenade -->
