  <path d="M0 357q89-33 164-12t155 12q97-40 182-16t161 8q82-23 138-11v70H0" fill="#bbd3c5"/>
  <path d="M0 365q135-7 264 0t275-1q144-5 261 0v124H0" fill="#a9d4ca"/>
  <g fill="none" stroke="#e4f0de" stroke-width="3" stroke-linecap="round">
    <path d="M29 390h65m15 0h17m552-9h66M51 419h25m556-17h46m34 35h59M105 451h40"/>
  </g>
  <path d="M0 477q180-9 361-2t439-6v131H0" fill="#eddbb7"/>
