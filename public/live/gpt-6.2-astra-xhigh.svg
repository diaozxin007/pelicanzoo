    <circle cx="408" cy="116" r="2.5" fill="#fffdf0"/>
    <path d="M392 107q7-5 14-3" fill="none" stroke="#304447" stroke-width="3"/>
    <path d="M345 111q-2-29 24-40 28-11 47 15l-4 7q-39-2-67 18Z"
