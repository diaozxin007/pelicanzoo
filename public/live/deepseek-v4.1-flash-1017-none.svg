<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <!-- Background -->
  <rect width="500" height="400" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect x="0" y="350" width="500" height="50" fill="#7CCD7C"/>
  
  <!-- Bicycle - Back Wheel -->
  <circle cx="150" cy="320" r="50" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="150" cy="320" r="5" fill="#333"/>
  <!-- Spokes back -->
  <line x1="150" y1="270" x2="150" y2="370" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="320" x2="200" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="115" y1="285" x2="185" y2="355" stroke="#333" stroke-width="2"/>
  <line x1="185" y1="285" x2="115" y2="355" stroke="#333" stroke-width="2"/>
  
  <!-- Bicycle - Front Wheel -->
  <circle cx="350" cy="320" r="50" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="350" cy="320" r="5" fill="#333"/>
  <!-- Spokes front -->
  <line x1="350" y1="270" x2="350" y2="370" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="320" x2="400" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="315" y1="285" x2="385" y2="355" stroke="#333" stroke-width="2"/>
  <line x1="385" y1="285" x2="315" y2="355" stroke="#333" stroke-width="2"/>
  
  <!-- Bicycle Frame -->
  <!-- Seat tube -->
  <line x1="200" y1="260" x2="150" y2="320" stroke="#E63946" stroke-width="6"/>
  <!-- Top tube -->
  <line x1="200" y1="260" x2="310" y2="260" stroke="#E63946" stroke-width="6"/>
  <!-- Down tube -->
  <line x1="200" y1="260" x2="250" y2="320" stroke="#E63946" stroke-width="6"/>
  <!-- Chain stay -->
  <line x1="150" y1="320" x2="250" y2="320" stroke="#E63946" stroke-width="6"/>
  <!-- Seat stay -->
  <line x1="150" y1="320" x2="310" y2="260" stroke="#E63946" stroke-width="6"/>
  <!-- Head tube -->
  <line x1="310" y1="260" x2="350" y2="320" stroke="#E63946" stroke-width="6"/>
  <!-- Fork -->
  <line x1="350" y1="320" x2="310" y2="260" stroke="#E63946" stroke-width="6"/>
  
  <!-- Seat -->
  <ellipse cx="200" cy="252" rx="20" ry="6" fill="#333"/>
  
  <!-- Handlebar post -->
  <line x1="310" y1="260" x2="310" y2="240" stroke="#333" stroke-width="4"/>
  <!-- Handlebar -->
  <line x1="290" y1="240" x2="330" y2="240" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Pedal crank -->
  <circle cx="250" cy="320" r="8" fill="#333"/>
  <line x1="240" y1="310" x2="260" y2="330" stroke="#333" stroke-width="4"/>
  <line x1="260" y1="310" x2="240" y2="330" stroke="#333" stroke-width="4"/>
  
  <!-- Pedals -->
  <rect x="232" y="305" width="16" height="6" rx="2" fill="#555" transform="rotate(-45 240 308)"/>
  <rect x="252" y="325" width="16" height="6" rx="2" fill="#555" transform="rotate(-45 260 328)"/>
  
  <!-- Chain -->
  <ellipse cx="200" cy="320" rx="50" ry="8" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="4,3"/>
  
  <!-- Pelican Body -->
  <ellipse cx="230" cy="210" rx="55" ry="45" fill="white" stroke="#DDD" stroke-width="2"/>
  
  <!-- Pelican wing (one leg on pedal) -->
  <ellipse cx="240" cy="240" rx="35" ry="20" fill="#F0F0F0" stroke="#DDD" stroke-width="1.5" transform="rotate(-20 240 240)"/>
  
  <!-- Pelican left leg (on pedal) -->
  <line x1="235" y1="250" x2="240" y2="305" stroke="#FF8C00" stroke-width="5" stroke-linecap="round"/>
  <!-- Pelican foot -->
  <path d="M232 305 L240 310 L248 305" fill="none" stroke="#FF8C00" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Pelican right leg -->
  <line x1="220" y1="250" x2="215" y2="295" stroke="#FF8C00" stroke-width="5" stroke-linecap="round"/>
  <!-- Right foot -->
  <path d="M207 295 L215 300 L223 295" fill="none" stroke="#FF8C00" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Pelican Neck -->
  <path d="M250 190 Q280 160 275 130" fill="none" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M250 190 Q280 160 275 130" fill="none" stroke="#F5F5F5" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Pelican Head -->
  <circle cx="275" cy="120" r="22" fill="white"/>
  
  <!-- Pelican Eye -->
  <circle cx="282" cy="115" r="5" fill="black"/>
  <circle cx="284" cy="113" r="2" fill="white"/>
  
  <!-- Pelican Beak -->
  <path d="M290 118 L370 130 L295 140 Z" fill="#FFB800"/>
  <line x1="290" y1="128" x2="365" y2="130" stroke="#E6A000" stroke-width="1.5"/>
  
  <!-- Pelican Beak Pouch -->
  <path d="M295 140 Q330 155 365 130 Q340 145 295 140 Z" fill="#FFD54F" opacity="0.8"/>
  
  <!-- Pelican Head Feathers/Crest -->
  <path d="M260 105 Q255 90 265 85" fill="none" stroke="#EEE" stroke-width="3" stroke-linecap="round"/>
  <path d="M268 100 Q268 85 278 80" fill="none" stroke="#EEE" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tail feathers -->
  <path d="M175 210 Q155 200 145 215" fill="none" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
  <path d="M175 220 Q150 215 140 230" fill="none" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Clouds -->
  <ellipse cx="80" cy="60" rx="40" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="110" cy="55" rx="35" ry="18" fill="white" opacity="0.8"/>
  <ellipse cx="400" cy="80" rx="45" ry="22" fill="white" opacity="0.7"/>
  <ellipse cx="430" cy="75" rx="30" ry="16" fill="white" opacity="0.7"/>
  
  <!-- Sun -->
  <circle cx="450" cy="45" r="30" fill="#FFE066"/>
  <line x1="450" y1="5" x2="450" y2="0" stroke="#FFE066" stroke-width="3"/>
  <line x1="480" y1="15" x2="490" y2="8" stroke="#FFE066" stroke-width="3"/>
  <line x1="490" y1="45" x2="500" y2="45" stroke="#FFE066" stroke-width="3"/>
  <line x1="480" y1="75" x2="490" y2="82" stroke="#FFE066" stroke-width="3"/>
  <line x1="420" y1="15" x2="410" y2="8" stroke="#FFE066" stroke-width="3"/>
  
  <!-- Motion lines -->
  <line x1="90" y1="290" x2="60" y2="290" stroke="#666" stroke-width="2" opacity="0.5"/>
  <line x1="85" y1="310" x2="50" y2="310" stroke="#666" stroke-width="2" opacity="0.4"/>
  <line x1="90" y1="330" x2="65" y2="330" stroke="#666" stroke-width="2" opacity="0.3"/>
</svg>