  <title id="gpt-6.1-sol-medium--title">Pelican riding a bicycle</title>
  <desc id="gpt-6.1-sol-medium--desc">A cheerful white pelican with a long orange bill pedals a teal bicycle beneath a sunny sky.</desc>

