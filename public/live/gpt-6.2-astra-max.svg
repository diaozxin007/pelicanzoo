  <title id="gpt-6.2-astra-max--title">Pelican on a beach cruiser</title>
  <desc id="gpt-6.2-astra-max--desc">A white pelican pedals a turquoise bicycle along the coast, one wing on the handlebars and a red scarf streaming behind it.</desc>

