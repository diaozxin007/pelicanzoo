    <circle cx="383" cy="424" r="18" fill="#e9c481" stroke="#2a474a" stroke-width="4"/>
    <circle cx="383" cy="424" r="9" fill="#f8e7bf" stroke="#65827b" stroke-width="3"/>
    <path d="M383 424l35-24" stroke="#2a474a" stroke-width="7"/>
