    <circle cx="447" cy="120" r="5" fill="#263e42"/>
    <circle cx="448.5" cy="118.5" r="1.5" fill="white"/>

    <!-- Scarf caught in the breeze -->
    <path d="M396 186q-21 0-43-16-20-15-49-8l13 7-15 6q22-2 44 12 24 14 50 10Z"
          fill="#d75c48" stroke="#563f3d" stroke-width="3.5"/>
    <path d="M393 184q19 13 44 10l-2 12q-27 4-48-11Z"
