<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="gpt-6.2-astra-high--title">The seaside cyclist</title>
  <desc id="gpt-6.2-astra-high--desc">A white pelican with a great orange bill and a fluttering red scarf pedals a turquoise bicycle along the coast.</desc>

  <defs>
    <g id="gpt-6.2-astra-high--wheel">
      <circle r="82" fill="none" stroke="#233e43" stroke-width="12"/>
      <circle r="76" fill="none" stroke="#f9e5bb" stroke-width="4"/>
      <g fill="none" stroke="#79958e" stroke-width="2">
        <path id="gpt-6.2-astra-high--spokes" d="M0-74V74 M-74 0H74"/>
        <use href="#gpt-6.2-astra-high--spokes" transform="rotate(22.5)"/>
        <use href="#gpt-6.2-astra-high--spokes" transform="rotate(45)"/>
        <use href="#gpt-6.2-astra-high--spokes" transform="rotate(67.5)"/>
      </g>
      <circle r="8" fill="#f3bd62" stroke="#233e43" stroke-width="4"/>
    </g>
  </defs>

  <!-- Salt air and a low afternoon sun -->
  <rect width="800" height="560" fill="#fcf1d9"/>
  <circle cx="557" cy="151" r="106" fill="#f8cf88"/>
  <g fill="none" stroke="#fffaf0" stroke-width="8" stroke-linecap="round">
    <path d="M75 135h43q10-23 33-13q10-23 35-12q12 5 14 18h32"/>
    <path d="M603 84h27q9-18 24-9q13-12 27 2h21"/>
  </g>
  <path d="M0 349q95-9 174 0t170 0t179 0t159 0t118 0v116H0Z" fill="#c3ddd0"/>
  <g fill="none" stroke="#92bcb1" stroke-width="3" stroke-linecap="round">
    <path d="M25 378h67m16 0h28m485-10h77m15 0h19M49 414h53m558-10h65"/>
  </g>
  <path d="M0 450q182-12 377 0t423-7v117H0Z" fill="#eedbb6"/>
  <ellipse cx="405" cy="512" rx="249" ry="10" fill="#d9c7a5"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Bicycle wheels and the far pedal -->
    <use href="#gpt-6.2-astra-high--wheel" transform="translate(241 423)"/>
    <use href="#gpt-6.2-astra-high--wheel" transform="translate(561 423)"/>
    <path d="M383 424l-35 23" fill="none" stroke="#375154" stroke-width="7"/>
    <path d="M334 448h28" stroke="#233e43" stroke-width="8"/>

    <!-- Far leg, bent on the downstroke -->
    <path d="M310 276q-6 38-30 65l54 96-9 5q-4 4 3 5l28-1q7-1 2-6l-15-9-44-88q28-28 37-58Z"
          fill="#d98c41" stroke="#34494a" stroke-width="4"/>

    <!-- Enameled diamond frame -->
    <g fill="none">
      <path id="gpt-6.2-astra-high--frame" d="M241 423l80-111 62 112-142-1m80-111 175-16 9 31-122 97m113-128 9 31 56 96"/>
      <use href="#gpt-6.2-astra-high--frame" stroke="#23464a" stroke-width="14"/>
      <use href="#gpt-6.2-astra-high--frame" stroke="#319e98" stroke-width="8"/>
      <path d="M330 314l157-14" stroke="#8ed1ba" stroke-width="2.5"/>
      <path d="M319 310l-9-23m187 9-11-38 27-10" stroke="#314b4d" stroke-width="8"/>
      <path d="M505 251l16-5" stroke="#a45c3c" stroke-width="11"/>
      <path d="M507 255q37 24 24 65" stroke="#425c59" stroke-width="2.5"/>
    </g>
    <path d="M281 285q9-6 29-2l29 1q8 1 5 7-8 6-48 7-16-1-15-13Z"
