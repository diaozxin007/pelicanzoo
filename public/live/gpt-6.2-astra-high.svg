    <path d="M260 269q40 23 86 15 46-7 69-44-17 50-74 58-50 6-81-29Z" fill="#d7ded0"/>
    <path d="M419 158q-9 18-6 40" fill="none" stroke="#bccbc0" stroke-width="3.5"/>

