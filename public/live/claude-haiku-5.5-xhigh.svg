<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Sky -->
  <rect width="400" height="270" fill="#bfe6ff"/>

  <!-- Sun -->
  <circle cx="365" cy="35" r="20" fill="#ffd54f"/>

  <!-- Clouds -->
  <g fill="#ffffff">
    <ellipse cx="80" cy="50" rx="28" ry="10"/>
    <ellipse cx="102" cy="44" rx="20" ry="10"/>
    <ellipse cx="220" cy="28" rx="22" ry="8"/>
    <ellipse cx="238" cy="23" rx="15" ry="7"/>
  </g>

  <!-- Ground -->
  <rect y="270" width="400" height="30" fill="#8bc34a"/>
  <rect y="270" width="400" height="3" fill="#558b2f"/>

  <!-- Speed lines -->
  <path d="M12,170 H40 M5,190 H34 M18,210 H44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Wheels -->
  <g fill="none" stroke="#222" stroke-width="5">
    <circle cx="110" cy="215" r="55"/>
    <circle cx="290" cy="215" r="55"/>
  </g>
  <g stroke="#9e9e9e" stroke-width="1">
    <path d="M55,215 H165 M110,160 V270 M76,181 L144,249 M144,181 L76,249"/>
    <path d="M235,215 H345 M290,160 V270 M256,181 L324,249 M324,181 L256,249"/>
  </g>
  <circle cx="110" cy="215" r="5" fill="#333"/>
  <circle cx="290" cy="215" r="5" fill="#333"/>

  <!-- Bicycle frame -->
  <g stroke="#e63946" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M110,215 L190,215"/>   <!-- chainstay -->
    <path d="M110,215 L160,130"/>   <!-- seat stay -->
    <path d="M190,215 L160,130"/>   <!-- seat tube -->
    <path d="M160,130 L272,128"/>   <!-- top tube -->
    <path d="M190,215 L272,150"/>   <!-- down tube -->
    <path d="M272,128 L266,155"/>   <!-- head tube -->
    <path d="M266,155 L290,215"/>   <!-- fork -->
    <path d="M272,128 L280,112"/>   <!-- stem -->
    <path d="M280,112 Q292,104 302,110"/> <!-- handlebar -->
  </g>

  <!-- Saddle -->
  <path d="M146,124 Q160,116 174,122 L172,130 Q160,134 148,131 Z" fill="#222"/>

  <!-- Crank and pedal -->
  <circle cx="190" cy="215" r="7" fill="#333"/>
  <path d="M190,215 L206,234" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <path d="M198,235 L214,235" stroke="#333" stroke-width="5" stroke-linecap="round"/>

  <!-- Pelican neck -->
  <path d="M226,96 C232,80 234,68 236,56 L256,56 C254,72 254,86 246,102 Z"
        fill="#f5f5f5" stroke="#333" stroke-width="2.5"/>

  <!-- Pelican body -->
  <path d="M126,120 C134,100 160,92 186,95 C208,88 228,80 242,84 C254,91 252,114 236,122 C216,132 190,130 170,126 C152,128 136,128 126,120 Z"
        fill="#f5f5f5" stroke="#333" stroke-width="2.5"/>

  <!-- Folded back wing -->
  <path d="M200,100 C180,94 150,98 124,116 C152,116 178,120 198,124 C206,118 206,108 200,100 Z"
        fill="#e6e6e6" stroke="#333" stroke-width="2"/>
  <path d="M180,104 Q168,112 150,118 M170,110 Q160,116 140,120" stroke="#999" stroke-width="1.2" fill="none"/>

  <!-- Leg -->
  <path d="M174,122 L196,160 L204,224" stroke="#f28c28" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Webbed foot on pedal -->
  <path d="M198,226 L214,224 L226,234 Q222,240 210,238 L198,238 Z" fill="#f28c28" stroke="#b5571a" stroke-width="1"/>

  <!-- Pelican head -->
  <circle cx="250" cy="50" r="15" fill="#f5f5f5" stroke="#333" stroke-width="2.5"/>

  <!-- Beak -->
  <path d="M258,44 C292,40 326,50 356,70 C322,62 290,58 258,58 Z"
        fill="#f4a623" stroke="#9a5b00" stroke-width="2"/>
  <!-- Throat pouch -->
  <path d="M258,58 C292,60 320,66 350,74 C340,92 318,100 296,94 C278,88 262,74 258,58 Z"
        fill="#f9c74f" stroke="#9a5b00" stroke-width="2"/>

  <!-- Eye -->
  <circle cx="254" cy="46" r="3.2" fill="#111"/>
  <circle cx="255" cy="45" r="1" fill="#fff"/>

  <!-- Wing-arm reaching to handlebar -->
  <path d="M214,102 Q252,96 296,108" stroke="#333" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M214,102 Q252,96 296,108" stroke="#e6e6e6" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>