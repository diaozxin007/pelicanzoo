  <path d="M292 202 Q319 174 365 173 Q421 172 453 208
           Q477 233 469 266 Q459 302 404 307
           Q346 312 309 281 Q275 252 281 221 Q283 210 292 202Z"
        fill="#fffdf5" stroke="#405762" stroke-width="4"/>

  <!-- Wing and feathers -->
  <path d="M332 201 Q371 189 409 207 Q438 220 451 247
           Q437 271 409 276 Q374 276 349 257 Q330 242 332 201Z"
        fill="#d9e9e7" stroke="#405762" stroke-width="4"/>
  <path d="M350 218 Q381 250 432 251 M356 235 Q378 263 409 272
