  <path d="M469 235 Q482 241 495 233"
        fill="none" stroke="#405762" stroke-width="3" stroke-linecap="round"/>

  <!-- Beak pouch, then upper beak -->
  <path d="M510 111 Q579 120 667 124
           Q647 174 608 191 Q568 210 542 176
           Q522 151 510 111Z"
        fill="#f2a65b" stroke="#ad673e" stroke-width="4" stroke-linejoin="round"/>
  <path d="M533 139 Q560 183 591 187"
        fill="none" stroke="#d8824b" stroke-width="4" stroke-linecap="round"/>
  <path d="M508 102 Q582 104 669 119 Q680 122 676 128
           Q672 135 658 132 Q575 127 508 114Z"
        fill="#ffd27d" stroke="#a96a3e" stroke-width="4" stroke-linejoin="round"/>
  <path d="M535 111 Q606 115 659 123" fill="none"
        stroke="#fff0b7" stroke-width="3" stroke-linecap="round"/>

  <!-- Face and head feathers -->
  <circle cx="499" cy="100" r="6" fill="#304650"/>
  <circle cx="501" cy="98" r="2" fill="#fff"/>
  <path d="M465 86 Q452 70 453 60 M474 82 Q472 65 478 56
           M484 81 Q493 68 496 65"
        fill="none" stroke="#fffdf5" stroke-width="9" stroke-linecap="round"/>
  <path d="M465 86 Q452 70 453 60 M474 82 Q472 65 478 56
           M484 81 Q493 68 496 65"
        fill="none" stroke="#405762" stroke-width="2" stroke-linecap="round"/>
</svg>