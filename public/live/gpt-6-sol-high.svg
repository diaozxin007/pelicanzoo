  <!-- Cranks and pedals -->
  <circle cx="410" cy="410" r="21" fill="#edf7f5" stroke="#304650" stroke-width="6"/>
  <path d="M410 410 374 376 M410 410 446 444"
        fill="none" stroke="#304650" stroke-width="8" stroke-linecap="round"/>
  <path d="M356 377h38 M428 445h38" stroke="#304650"
        stroke-width="8" stroke-linecap="round"/>
  <circle cx="220" cy="414" r="10" fill="#304650"/>
  <circle cx="600" cy="414" r="10" fill="#304650"/>

  <!-- Tail and pedaling legs -->
  <path d="M303 219 Q258 196 217 199 Q243 212 263 225
           Q231 217 213 227 Q249 247 293 249Z"
        fill="#f9faf4" stroke="#405762" stroke-width="4" stroke-linejoin="round"/>
  <g fill="none" stroke="#dc8a48" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <path d="M352 272 335 328 374 375"/>
    <path d="M392 276 423 343 447 442"/>
  </g>
  <g fill="#e89a53" stroke="#bf7040" stroke-width="3" stroke-linejoin="round">
    <path d="M371 365 Q383 369 391 376 L408 379 Q416 381 412 387
