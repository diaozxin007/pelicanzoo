<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="gpt-6-sol-high--title">Pelican riding a bicycle</title>
  <desc id="gpt-6-sol-high--desc">A white pelican with an orange beak and pouch pedals a teal bicycle along a sunny path.</desc>

  <!-- Background -->
  <rect width="800" height="560" fill="#e9f7f8"/>
  <circle cx="105" cy="95" r="42" fill="#ffdb83"/>
  <g fill="#fff" opacity=".85">
    <ellipse cx="239" cy="91" rx="48" ry="15"/>
    <ellipse cx="270" cy="81" rx="30" ry="20"/>
    <ellipse cx="686" cy="74" rx="54" ry="16"/>
    <ellipse cx="652" cy="67" rx="28" ry="20"/>
  </g>
  <path d="M0 503 Q180 494 360 505 T800 501 V560 H0Z" fill="#f5e8ca"/>
  <path d="M0 507 Q200 501 400 508 T800 505" fill="none" stroke="#d7cba9" stroke-width="3"/>
  <ellipse cx="410" cy="518" rx="310" ry="11" fill="#a9b9ad" opacity=".22"/>

  <!-- Wheels -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#90afb2" stroke-width="2">
      <path d="M220 414V333 M220 414V495 M220 414H139 M220 414H301
               M220 414L163 357 M220 414L277 357 M220 414L163 471 M220 414L277 471"/>
      <path d="M600 414V333 M600 414V495 M600 414H519 M600 414H681
               M600 414L543 357 M600 414L657 357 M600 414L543 471 M600 414L657 471"/>
    </g>
    <g stroke="#304650" stroke-width="11">
      <circle cx="220" cy="414" r="90"/>
      <circle cx="600" cy="414" r="90"/>
    </g>
    <g stroke="#fff" stroke-width="2" opacity=".8">
      <circle cx="220" cy="414" r="82"/>
      <circle cx="600" cy="414" r="82"/>
    </g>
  </g>

  <!-- Bicycle -->
  <g fill="none" stroke="#246f78" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M220 414 351 285 410 410 220 414
             M351 285 524 285 410 410
             M524 285 600 414"/>
  </g>
  <g fill="none" stroke="#304650" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M351 285 345 268"/>
    <path d="M524 285 520 247 Q518 226 499 230 L474 239"/>
  </g>
  <path d="M317 271 Q350 260 386 272 Q389 278 377 281 H329 Q317 280 317 271Z"
        fill="#304650"/>
  <path d="M473 239 Q486 227 501 230" fill="none" stroke="#304650"
