    <path d="M441 432 Q453 433 460 440 L482 442 Q491 445 485 452
             L449 453 Q437 452 432 444Z"/>
  </g>

  <!-- Pelican neck and body -->
  <path d="M425 236 Q452 206 450 164 Q438 119 457 96
           Q470 78 492 81 Q515 81 522 98 Q527 115 509 124
           Q490 132 474 113 Q465 145 483 177
           Q514 222 504 259 Q496 290 469 298Z"
