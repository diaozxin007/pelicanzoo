  <title id="gpt-6.1-sol-xhigh--title">Pelican riding a bicycle</title>
  <desc id="gpt-6.1-sol-xhigh--desc">A cheerful white pelican with a golden bill pedals a teal bicycle beneath a sunny sky.</desc>

