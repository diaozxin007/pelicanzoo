        <path d="M-66-66L66 66M-66 66L66-66"/>
        <path d="M-36-87L36 87M-87-36L87 36"/>
        <path d="M-36 87L36-87M-87 36L87-36"/>
      </g>
      <circle r="10" fill="#e0e9e8" stroke="#293e49" stroke-width="4"/>
    </g>
  </defs>

  <!-- Sunny backdrop -->
