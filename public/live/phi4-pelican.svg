<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Bicycle Frame -->
  <rect x="50" y="100" width="100" height="10" fill="black"/>
  <rect x="70" y="110" width="60" height="10" fill="black"/>
  <circle cx="100" cy="120" r="10" fill="black"/>
  <circle cx="100" cy="140" r="10" fill="black"/>
  <line x1="100" y1="130" x2="100" y2="150" stroke="black" stroke-width="2"/>
  <line x1="100" y1="150" x2="120" y2="170" stroke="black" stroke-width="2"/>
  <line x1="100" y1="150" x2="80" y2="170" stroke="black" stroke-width="2"/>

  <!-- Pelican Body -->
  <ellipse cx="90" cy="80" rx="20" ry="10" fill="blue"/>
  <circle cx="90" cy="70" r="5" fill="yellow"/>
  <circle cx="80" cy="60" r="5" fill="yellow"/>
  <circle cx="100" cy="60" r="5" fill="yellow"/>

  <!-- Pelican Beak -->
  <polygon points="90,75 85,65 95,65" fill="orange"/>

  <!-- Pelican Wings -->
  <path d="M 70 70 Q 60 60, 50 70" fill="blue"/>
  <path d="M 110 70 Q 120 60, 130 70" fill="blue"/>

  <!-- Pelican Legs -->
  <line x1="85" y1="90" x2="85" y2="100" stroke="black" stroke-width="2"/>
  <line x1="105" y1="90" x2="105" y2="100" stroke="black" stroke-width="2"/>
</svg>