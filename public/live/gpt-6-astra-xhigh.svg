        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M369 313L406 373L369 461"
        fill="none" stroke="#d99a3e" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M369 458L378 468L389 476Q395 483 385 483L353 480
