  <path d="M426 107L414 82Q430 84 440 101
           M438 102L436 78Q451 85 454 101"
        fill="#fffdf5" stroke="#263d45" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pelican body and gracefully curved neck -->
  <path d="M285 274
           C265 266 253 249 251 233
           L300 250
           C309 220 339 210 373 219
           C398 225 415 239 416 257
           C431 238 430 217 416 195
           C400 171 402 143 418 124
           C422 103 440 91 459 95
           C484 98 494 119 483 138
           C474 157 454 161 446 181
           C437 201 463 226 458 254
           C455 294 419 326 377 328
           C337 333 300 313 285 274Z"
        fill="#fffdf5" stroke="#263d45" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

