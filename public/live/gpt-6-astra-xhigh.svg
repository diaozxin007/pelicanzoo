<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"
     role="img" aria-labelledby="title desc">
  <title id="gpt-6-astra-xhigh--title">Pelican riding a bicycle</title>
  <desc id="gpt-6-astra-xhigh--desc">A cheerful white pelican with a golden bill and coral scarf pedals a turquoise bicycle.</desc>

  <defs>
    <g id="gpt-6-astra-xhigh--wheel">
      <circle r="98" fill="#fffdf5" stroke="#263d45" stroke-width="12"/>
      <circle r="87" fill="none" stroke="#cbded7" stroke-width="3"/>
      <g stroke="#a0bcb8" stroke-width="2">
        <path d="M0-85V85 M-85 0H85"/>
        <path d="M-60-60L60 60 M-60 60L60-60"/>
        <path d="M-33-79L33 79 M-79-33L79 33"/>
        <path d="M-79 33L79-33 M-33 79L33-79"/>
      </g>
      <circle r="9" fill="#f7bd49" stroke="#263d45" stroke-width="3"/>
    </g>
    <path id="gpt-6-astra-xhigh--frame" d="M230 455L354 350L406 455H230
                        M354 350L536 338L548 365L406 455
                        M536 338L580 455"/>
  </defs>

  <!-- A breezy afternoon -->
  <rect width="800" height="600" fill="#faf6eb"/>
  <circle cx="413" cy="291" r="230" fill="#e5efe5"/>
  <circle cx="663" cy="105" r="41" fill="#f8d69a"/>
  <g fill="none" stroke="#e8bd7f" stroke-width="3" stroke-linecap="round">
    <path d="M663 48V39 M663 171V162 M606 105H597 M729 105H720"/>
    <path d="M622 64L616 58 M710 152L704 146 M622 146L616 152 M710 58L704 64"/>
  </g>
  <g fill="#fffdf7">
    <path d="M89 168C77 168 75 150 88 145C87 127 111 119 121 135
             C134 124 155 134 153 148C174 148 179 168 163 168Z"/>
    <path d="M545 75C535 75 532 61 544 56C545 40 569 37 576 53
             C589 46 604 56 601 65C617 64 622 75 609 75Z"/>
  </g>

  <!-- Ground and little roadside plants -->
  <ellipse cx="407" cy="558" rx="297" ry="17" fill="#d1dfce"/>
  <g fill="none" stroke="#88aa90" stroke-width="3" stroke-linecap="round">
    <path d="M112 550L107 536 M112 550L119 531 M112 550L126 541"/>
    <path d="M690 550L682 535 M690 550L693 529 M690 550L703 540"/>
  </g>
  <g fill="#b3c7ae">
    <ellipse cx="157" cy="567" rx="8" ry="3"/>
    <ellipse cx="647" cy="576" rx="11" ry="3"/>
  </g>
  <g fill="none" stroke="#a7c2b5" stroke-width="4" stroke-linecap="round">
    <path d="M111 298H168 M94 316H151 M121 334H158"/>
  </g>

  <!-- Wheels -->
  <use href="#gpt-6-astra-xhigh--wheel" transform="translate(230 455)"/>
  <use href="#gpt-6-astra-xhigh--wheel" transform="translate(580 455)"/>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#gpt-6-astra-xhigh--frame" stroke="#263d45" stroke-width="13"/>
    <use href="#gpt-6-astra-xhigh--frame" stroke="#35a7a1" stroke-width="8"/>
    <path d="M360 347L528 336" stroke="#a0ded0" stroke-width="2.5"/>
    <path d="M345 329L354 350" stroke="#263d45" stroke-width="8"/>
    <path d="M536 338L526 307Q523 294 537 291H555Q574 291 572 305L569 313"
          stroke="#263d45" stroke-width="7"/>
    <path d="M568 302L565 315" stroke="#df785c" stroke-width="9"/>
  </g>

  <!-- Saddle, bell, chain and pedals -->
  <path d="M320 324Q340 316 359 322Q369 324 363 331L331 334Q319 334 320 324Z"
        fill="#263d45"/>
  <circle cx="551" cy="283" r="7" fill="#f7bd49" stroke="#263d45" stroke-width="3"/>
  <path d="M230 441L406 430A25 25 0 0 1 406 480L230 469A14 14 0 0 1 230 441Z"
        fill="none" stroke="#78938d" stroke-width="3"/>
  <circle cx="406" cy="455" r="25" fill="#f9f5e9" stroke="#263d45" stroke-width="4"/>
  <circle cx="406" cy="455" r="16" fill="#d4e4dc"/>
  <path d="M375 478L406 455L437 432" fill="none" stroke="#263d45"
