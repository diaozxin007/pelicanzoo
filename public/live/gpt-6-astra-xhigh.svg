        fill="#d99a3e" stroke="#263d45" stroke-width="3" stroke-linejoin="round"/>
  <path d="M368 472L377 479 M361 475L366 480"
        fill="none" stroke="#ac742f" stroke-width="2"/>

  <!-- Near leg and webbed foot -->
  <path d="M397 311L449 366L432 421"
        fill="none" stroke="#263d45" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M397 311L449 366L432 421"
        fill="none" stroke="#f4b347" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M432 418L441 424L458 431Q465 438 455 439L422 435
           Q416 431 424 426Z"
        fill="#f4b347" stroke="#263d45" stroke-width="3" stroke-linejoin="round"/>
  <path d="M436 427L448 436 M429 430L436 436"
        fill="none" stroke="#d49135" stroke-width="2"/>

