  <path d="M258 243L288 260 M267 257L290 269"
        fill="none" stroke="#b2c6c0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Scarf fluttering behind -->
  <path d="M417 182C389 180 374 168 362 153L366 178L345 170
           C361 195 383 201 418 193Z"
        fill="#e76f59" stroke="#263d45" stroke-width="3" stroke-linejoin="round"/>
  <path d="M369 181Q388 191 410 189" fill="none" stroke="#bd5148" stroke-width="2.5"/>
  <path d="M408 177Q426 186 446 177L450 190Q429 201 413 191Z"
        fill="#ef8065" stroke="#263d45" stroke-width="3" stroke-linejoin="round"/>

  <!-- Long pelican throat pouch -->
  <path d="M481 149L654 163
           C623 174 590 195 551 199
           C516 204 492 184 481 161Z"
        fill="#eda44c" stroke="#263d45" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M500 166C520 188 550 194 580 183"
        fill="none" stroke="#f9c96d" stroke-width="7" stroke-linecap="round"/>

  <!-- Upper bill and hooked tip -->
  <path d="M481 130C535 126 600 138 666 159
           Q674 162 668 168L658 173L652 165L485 157Z"
        fill="#f7bd49" stroke="#263d45" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M496 138Q564 138 634 155"
        fill="none" stroke="#ffe29a" stroke-width="4" stroke-linecap="round"/>
  <path d="M486 157L652 165" fill="none" stroke="#b97a33" stroke-width="2"/>
  <ellipse cx="505" cy="143" rx="4" ry="2" fill="#b97a33"/>

  <!-- Bright, happy face -->
  <circle cx="463" cy="120" r="7" fill="#263d45"/>
  <circle cx="465" cy="118" r="2.2" fill="#ffffff"/>
  <path d="M454 107Q462 102 469 107"
        fill="none" stroke="#263d45" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="452" cy="139" rx="10" ry="7" fill="#f4c3a5" opacity=".75"/>

  <!-- Wing reaching forward to steer -->
  <path d="M322 250
           C337 232 363 232 383 250
           C405 269 426 280 449 284
           L546 290Q557 294 548 301
           C509 315 462 312 426 301
           C400 315 367 317 343 301
           C326 289 319 270 322 250Z"
        fill="#e7eee7" stroke="#263d45" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M337 249C356 248 369 260 382 274
           C407 297 445 300 476 301"
        fill="none" stroke="#b3c9c1" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#9fbab2" stroke-width="2.5" stroke-linecap="round">
    <path d="M346 278Q361 294 378 294"/>
    <path d="M359 270Q377 289 395 291"/>
    <path d="M378 269Q397 285 414 288"/>
    <path d="M521 295L538 299"/>
  </g>
  <path d="M545 290H559" fill="none" stroke="#263d45" stroke-width="7" stroke-linecap="round"/>
  <path d="M535 291Q541 286 546 291L547 297"
        fill="none" stroke="#fffdf5" stroke-width="5" stroke-linecap="round"/>

  <!-- A tiny glint of bicycle-day joy -->
  <g stroke="#d4af68" stroke-width="3" stroke-linecap="round">
    <path d="M682 272V288 M674 280H690"/>
    <path d="M189 228V238 M184 233H194"/>
  </g>
</svg>