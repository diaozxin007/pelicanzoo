<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" rx="20" fill="#B3E5FC"/>
  <circle cx="120" cy="110" r="55" fill="#FFEB3B" stroke="#FBC02D" stroke-width="4"/>
  <g fill="white" opacity="0.9">
    <ellipse cx="320" cy="100" rx="50" ry="25"/>
    <ellipse cx="360" cy="90" rx="45" ry="22"/>
    <ellipse cx="630" cy="80" rx="55" ry="26"/>
    <ellipse cx="670" cy="70" rx="40" ry="20"/>
  </g>
  <!-- distant hills -->
  <ellipse cx="100" cy="500" rx="250" ry="80" fill="#A5D6A7"/>
  <ellipse cx="750" cy="500" rx="250" ry="90" fill="#A5D6A7"/>
  <!-- Road -->
  <rect x="0" y="450" width="800" height="150" fill="#78909C"/>
  <rect x="0" y="450" width="800" height="12" fill="#616161"/>
  <g fill="white">
    <rect x="20" y="520" width="60" height="10" rx="5"/>
    <rect x="120" y="520" width="60" height="10" rx="5"/>
    <rect x="220" y="520" width="60" height="10" rx="5"/>
    <rect x="320" y="520" width="60" height="10" rx="5"/>
    <rect x="420" y="520" width="60" height="10" rx="5"/>
    <rect x="520" y="520" width="60" height="10" rx="5"/>
    <rect x="620" y="520" width="60" height="10" rx="5"/>
    <rect x="720" y="520" width="60" height="10" rx="5"/>
  </g>
  <!-- Speed lines -->
  <g stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="80" y1="350" x2="180" y2="350"/>
    <line x1="60" y1="390" x2="160" y2="390"/>
  </g>

  <!-- BICYCLE - rear wheel -->
  <g id="muse-spark-1.3-low--rear-wheel">
    <circle cx="250" cy="450" r="80" fill="white" stroke="#212121" stroke-width="12"/>
    <circle cx="250" cy="450" r="70" fill="none" stroke="#90A4AE" stroke-width="3"/>
    <g stroke="#B0BEC5" stroke-width="2">
      <line x1="250" y1="380" x2="250" y2="520"/>
      <line x1="180" y1="450" x2="320" y2="450"/>
      <line x1="200" y1="400" x2="300" y2="500"/>
      <line x1="300" y1="400" x2="200" y2="500"/>
    </g>
    <circle cx="250" cy="450" r="10" fill="#616161"/>
  </g>
  <!-- BICYCLE - front wheel -->
  <g id="muse-spark-1.3-low--front-wheel">
    <circle cx="550" cy="450" r="80" fill="white" stroke="#212121" stroke-width="12"/>
    <circle cx="550" cy="450" r="70" fill="none" stroke="#90A4AE" stroke-width="3"/>
    <g stroke="#B0BEC5" stroke-width="2">
      <line x1="550" y1="380" x2="550" y2="520"/>
      <line x1="480" y1="450" x2="620" y2="450"/>
      <line x1="500" y1="400" x2="600" y2="500"/>
      <line x1="600" y1="400" x2="500" y2="500"/>
    </g>
    <circle cx="550" cy="450" r="10" fill="#616161"/>
  </g>

  <!-- Frame -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="250" y1="450" x2="440" y2="450" stroke="#455A64" stroke-width="8"/>
    <line x1="375" y1="305" x2="250" y2="450" stroke="#E53935" stroke-width="8"/>
    <line x1="375" y1="305" x2="440" y2="450" stroke="#E53935" stroke-width="8"/>
    <line x1="375" y1="305" x2="538" y2="315" stroke="#E53935" stroke-width="8"/>
    <line x1="440" y1="450" x2="538" y2="315" stroke="#E53935" stroke-width="8"/>
    <line x1="538" y1="315" x2="550" y2="450" stroke="#212121" stroke-width="8"/>
    <path d="M538 315 L558 265 L590 265" stroke="#212121" stroke-width="8"/>
  </g>
  <rect x="575" y="255" width="28" height="14" rx="7" fill="#212121" transform="rotate(-10 575 255)"/>
  <!-- Seat -->
  <ellipse cx="365" cy="290" rx="36" ry="12" fill="#212121"/>
  <rect x="370" y="290" width="10" height="20" fill="#616161"/>
  <!-- Bottom bracket + pedals -->
  <circle cx="440" cy="450" r="14" fill="#212121"/>
  <line x1="440" y1="450" x2="400" y2="480" stroke="#212121" stroke-width="6" stroke-linecap="round"/>
  <line x1="440" y1="450" x2="480" y2="420" stroke="#212121" stroke-width="6" stroke-linecap="round"/>
  <rect x="380" y="474" width="40" height="12" rx="4" fill="#212121"/>
  <rect x="460" y="414" width="40" height="12" rx="4" fill="#212121"/>

  <!-- PELICAN TAIL -->
  <path d="M290 230 L225 200 L240 235 L215 245 L285 265 Z" fill="#ECEFF1" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>

  <!-- PELICAN LEGS -->
  <g stroke="#FF8F00" stroke-width="10" stroke-linecap="round">
    <line x1="400" y1="315" x2="400" y2="478"/>
    <line x1="430" y1="315" x2="480" y2="418"/>
  </g>
  <g fill="#FF8F00">
    <ellipse cx="400" cy="483" rx="14" ry="7"/>
    <ellipse cx="480" cy="419" rx="14" ry="7"/>
  </g>

  <!-- PELICAN BODY -->
  <ellipse cx="380" cy="250" rx="105" ry="72" fill="white" stroke="#212121" stroke-width="4"/>
  <!-- Wing on body -->
  <ellipse cx="360" cy="255" rx="60" ry="35" fill="#ECEFF1" stroke="#212121" stroke-width="3" transform="rotate(-15 360 255)"/>
  <path d="M315 260 Q340 275 365 265" fill="none" stroke="#B0BEC5" stroke-width="3" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M430 210 Q490 190 500 140 L545 140 Q535 200 460 260 Z" fill="white" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>

  <!-- Arm/wing to handlebar -->
  <path d="M430 240 Q500 250 558 268" fill="none" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <path d="M430 240 Q500 250 558 268" fill="none" stroke="#212121" stroke-width="28" stroke-linecap="round" opacity="0"/>
  <path d="M430 240 Q500 250 558 268" fill="none" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <path d="M420 230 Q500 240 560 260" fill="none" stroke="#212121" stroke-width="3" opacity="0.3"/>
  <circle cx="562" cy="268" r="10" fill="#FF8F00" stroke="#212121" stroke-width="3"/>

  <!-- Head -->
  <circle cx="520" cy="135" r="47" fill="white" stroke="#212121" stroke-width="4"/>
  <!-- Beak pouch -->
  <path d="M560 145 L675 165 L560 185 Z" fill="#FF8F00" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>
  <path d="M562 172 Q615 225 665 168 Q620 185 562 172" fill="#FFB74D" stroke="#212121" stroke-width="3"/>
  <!-- Eye + blush -->
  <circle cx="532" cy="125" r="8" fill="#212121"/>
  <circle cx="534.5" cy="122.5" r="2.5" fill="white"/>
  <ellipse cx="515" cy="145" rx="10" ry="6" fill="#FFCDD2"/>
  <!-- Feather tuft -->
  <path d="M490 95 Q500 75 515 90 Q520 70 532 92" fill="none" stroke="#212121" stroke-width="4" stroke-linecap="round"/>

  <!-- Scarf flowing -->
  <path d="M475 160 Q430 170 390 160 Q410 185 455 185 Z" fill="#00ACC1" stroke="#212121" stroke-width="3"/>
  <path d="M390 160 Q330 165 290 145 Q310 175 335 180 Q320 190 300 190 Q340 210 390 175 Z" fill="#00E5FF" stroke="#212121" stroke-width="3" stroke-linejoin="round"/>

  <!-- Little helmet? sailor cap -->
  <path d="M485 100 Q520 75 555 100 L550 112 Q520 95 490 112 Z" fill="#FFEB3B" stroke="#212121" stroke-width="3"/>
</svg>