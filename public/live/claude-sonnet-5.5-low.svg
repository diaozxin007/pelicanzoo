<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- background -->
  <rect width="400" height="300" fill="#dff1ff"/>
  <rect y="245" width="400" height="55" fill="#8fce7a"/>

  <!-- sun -->
  <circle cx="340" cy="50" r="24" fill="#ffd84d"/>

  <!-- bicycle wheels -->
  <g fill="none" stroke="#333" stroke-width="5">
    <circle cx="110" cy="215" r="42"/>
    <circle cx="290" cy="215" r="42"/>
  </g>
  <g stroke="#888" stroke-width="1.5">
    <line x1="110" y1="173" x2="110" y2="257"/>
    <line x1="68" y1="215" x2="152" y2="215"/>
    <line x1="290" y1="173" x2="290" y2="257"/>
    <line x1="248" y1="215" x2="332" y2="215"/>
  </g>

  <!-- bicycle frame -->
  <g stroke="#d33" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="110" y1="215" x2="185" y2="215"/>
    <line x1="110" y1="215" x2="165" y2="150"/>
    <line x1="185" y1="215" x2="165" y2="150"/>
    <line x1="165" y1="150" x2="270" y2="150"/>
    <line x1="185" y1="215" x2="270" y2="150"/>
    <line x1="270" y1="150" x2="290" y2="215"/>
    <line x1="270" y1="150" x2="265" y2="130"/>
    <line x1="255" y1="130" x2="285" y2="130"/>
  </g>
  <!-- seat -->
  <line x1="165" y1="150" x2="160" y2="135" stroke="#333" stroke-width="5"/>
  <rect x="145" y="130" width="30" height="8" rx="4" fill="#333"/>
  <!-- crank and pedal -->
  <circle cx="185" cy="215" r="9" fill="#555"/>
  <line x1="185" y1="215" x2="200" y2="238" stroke="#333" stroke-width="5"/>
  <rect x="194" y="236" width="18" height="6" fill="#333"/>

  <!-- pelican body -->
  <ellipse cx="160" cy="108" rx="48" ry="30" fill="#fff" stroke="#999" stroke-width="2"/>
  <!-- tail -->
  <polygon points="118,105 90,120 120,125" fill="#eee" stroke="#999" stroke-width="2"/>
  <!-- wing -->
  <path d="M135 100 Q160 85 185 105 Q165 132 135 118 Z" fill="#cfd8dc" stroke="#889" stroke-width="2"/>
  <!-- neck -->
  <path d="M195 100 Q225 90 215 60 Q212 45 225 42" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  <path d="M195 100 Q225 90 215 60 Q212 45 225 42" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" transform="translate(0,-8)" opacity="0"/>
  <!-- head -->
  <circle cx="228" cy="40" r="14" fill="#fff" stroke="#999" stroke-width="2"/>
  <!-- beak -->
  <path d="M238 36 L310 44 Q275 52 240 50 Z" fill="#f4a834" stroke="#c77c10" stroke-width="2"/>
  <path d="M240 50 Q275 52 310 44 Q285 78 245 56 Z" fill="#f7c35f" stroke="#c77c10" stroke-width="2"/>
  <!-- eye -->
  <circle cx="230" cy="36" r="3" fill="#111"/>

  <!-- legs -->
  <g stroke="#f4a834" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M155 133 L175 140 L200 238"/>
    <path d="M165 135 L185 145 L180 215"/>
  </g>
  <!-- wing reaching handlebar -->
  <path d="M180 100 Q230 105 262 128" fill="none" stroke="#cfd8dc" stroke-width="9" stroke-linecap="round"/>
  <!-- feet -->
  <ellipse cx="205" cy="240" rx="10" ry="4" fill="#f4a834"/>
</svg>