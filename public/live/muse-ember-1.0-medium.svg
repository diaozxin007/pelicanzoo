<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
  <title>Pelican Riding a Bicycle</title>
  <defs>
    <linearGradient id="muse-ember-1.0-medium--sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ED8FF"/>
      <stop offset="100%" stop-color="#E8F9FF"/>
    </linearGradient>
    <linearGradient id="muse-ember-1.0-medium--bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D9E6EC"/>
    </linearGradient>
    <linearGradient id="muse-ember-1.0-medium--beakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#FF7A3D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="520" fill="url(#muse-ember-1.0-medium--sky)"/>
  <circle cx="120" cy="95" r="52" fill="#FFD93D"/>
  <circle cx="120" cy="95" r="68" fill="#FFD93D" opacity="0.25"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.95">
    <ellipse cx="650" cy="90" rx="70" ry="28"/>
    <ellipse cx="700" cy="105" rx="55" ry="22"/>
    <ellipse cx="280" cy="70" rx="55" ry="20"/>
    <ellipse cx="320" cy="82" rx="40" ry="16"/>
  </g>

  <!-- Road -->
  <rect x="0" y="520" width="800" height="80" fill="#8A9BA5"/>
  <rect x="0" y="520" width="800" height="10" fill="#7A8B95"/>
  <g stroke="#FFFFFF" stroke-width="6" stroke-dasharray="40 30" opacity="0.7">
    <line x1="0" y1="560" x2="800" y2="560"/>
  </g>
  <rect x="0" y="505" width="800" height="18" fill="#7AC74F"/>

  <!-- Motion lines -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="30" y1="260" x2="110" y2="260"/>
    <line x1="15" y1="310" x2="90" y2="310"/>
    <line x1="40" y1="360" x2="115" y2="360"/>
  </g>

  <!-- ===== BICYCLE WHEELS ===== -->
  <!-- Rear wheel -->
  <g>
    <circle cx="240" cy="450" r="75" fill="none" stroke="#2B2B2B" stroke-width="9"/>
    <circle cx="240" cy="450" r="62" fill="none" stroke="#B0BEC5" stroke-width="3"/>
    <g stroke="#90A4AE" stroke-width="3">
      <line x1="240" y1="450" x2="305" y2="450"/><line x1="240" y1="450" x2="286" y2="496"/>
      <line x1="240" y1="450" x2="240" y2="515"/><line x1="240" y1="450" x2="194" y2="496"/>
      <line x1="240" y1="450" x2="175" y2="450"/><line x1="240" y1="450" x2="194" y2="404"/>
      <line x1="240" y1="450" x2="240" y2="385"/><line x1="240" y1="450" x2="286" y2="404"/>
    </g>
  </g>
  <!-- Front wheel -->
  <g>
    <circle cx="560" cy="450" r="75" fill="none" stroke="#2B2B2B" stroke-width="9"/>
    <circle cx="560" cy="450" r="62" fill="none" stroke="#B0BEC5" stroke-width="3"/>
    <g stroke="#90A4AE" stroke-width="3">
      <line x1="560" y1="450" x2="625" y2="450"/><line x1="560" y1="450" x2="606" y2="496"/>
      <line x1="560" y1="450" x2="560" y2="515"/><line x1="560" y1="450" x2="514" y2="496"/>
      <line x1="560" y1="450" x2="495" y2="450"/><line x1="560" y1="450" x2="514" y2="404"/>
      <line x1="560" y1="450" x2="560" y2="385"/><line x1="560" y1="450" x2="606" y2="404"/>
    </g>
  </g>

  <!-- Fenders -->
  <path d="M 165 450 A 75 75 0 0 1 315 450" fill="none" stroke="#0097A7" stroke-width="7" stroke-linecap="round"/>
  <path d="M 485 450 A 75 75 0 0 1 635 450" fill="none" stroke="#0097A7" stroke-width="7" stroke-linecap="round"/>

  <!-- ===== BICYCLE FRAME ===== -->
  <g stroke="#00ACC1" stroke-width="11" stroke-linecap="round" fill="none">
    <line x1="330" y1="345" x2="390" y2="455"/> <!-- seat tube -->
    <line x1="390" y1="455" x2="515" y2="358"/> <!-- down tube -->
    <line x1="335" y1="355" x2="515" y2="358"/> <!-- top tube -->
    <line x1="330" y1="345" x2="240" y2="450"/> <!-- seat stay -->
    <line x1="390" y1="455" x2="240" y2="450"/> <!-- chain stay -->
    <line x1="515" y1="358" x2="560" y2="450"/> <!-- fork -->
  </g>
  <!-- Chain -->
  <line x1="240" y1="450" x2="390" y2="455" stroke="#555" stroke-width="4" stroke-dasharray="6 4"/>
  <line x1="240" y1="450" x2="390" y2="438" stroke="#555" stroke-width="4" stroke-dasharray="6 4"/>

  <!-- Seat -->
  <line x1="330" y1="345" x2="325" y2="328" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="322" cy="325" rx="38" ry="12" fill="#37474F" transform="rotate(-8 322 325)"/>

  <!-- Handlebar -->
  <line x1="515" y1="358" x2="538" y2="318" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <path d="M 538 318 C 520 300, 498 302, 492 315" fill="none" stroke="#37474F" stroke-width="9" stroke-linecap="round"/>
  <path d="M 538 318 C 552 305, 568 308, 570 320" fill="none" stroke="#37474F" stroke-width="9" stroke-linecap="round"/>

  <!-- Crank & Pedals -->
  <circle cx="390" cy="455" r="16" fill="#607D8B" stroke="#37474F" stroke-width="4"/>
  <line x1="390" y1="455" x2="422" y2="482" stroke="#37474F" stroke-width="7" stroke-linecap="round"/>
  <line x1="390" y1="455" x2="360" y2="432" stroke="#37474F" stroke-width="7" stroke-linecap="round"/>
  <rect x="410" y="478" width="28" height="9" rx="4" fill="#263238"/>
  <rect x="346" y="428" width="28" height="9" rx="4" fill="#263238"/>

  <!-- Hubs -->
  <circle cx="240" cy="450" r="11" fill="#37474F"/>
  <circle cx="560" cy="450" r="11" fill="#37474F"/>
  <circle cx="390" cy="455" r="5" fill="#ECEFF1"/>

  <!-- Basket with fish -->
  <g>
    <path d="M 545 368 L 620 368 L 608 432 L 558 432 Z" fill="#C49A6C" stroke="#8D6E4A" stroke-width="4" stroke-linejoin="round"/>
    <line x1="560" y1="368" x2="565" y2="432" stroke="#8D6E4A" stroke-width="3"/>
    <line x1="582" y1="368" x2="583" y2="432" stroke="#8D6E4A" stroke-width="3"/>
    <line x1="602" y1="368" x2="598" y2="432" stroke="#8D6E4A" stroke-width="3"/>
    <line x1="548" y1="395" x2="615" y2="395" stroke="#8D6E4A" stroke-width="3"/>
    <!-- Fish tails -->
    <path d="M 570 368 L 558 338 L 572 348 L 584 334 L 586 368 Z" fill="#90CAF9" stroke="#42A5F5" stroke-width="2"/>
    <path d="M 592 368 L 588 344 L 600 354 L 612 342 L 614 368 Z" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
  </g>

  <!-- ===== PELICAN LEGS ===== -->
  <g fill="none" stroke="#FF8A3D" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 365 345 L 400 405 L 422 478"/>
    <path d="M 320 350 L 345 395 L 360 428"/>
  </g>
  <!-- Webbed feet -->
  <path d="M 422 478 L 445 485 L 440 495 L 425 492 L 410 486 Z" fill="#FF8A3D"/>
  <path d="M 360 428 L 382 435 L 377 445 L 362 442 L 348 436 Z" fill="#FF8A3D"/>

  <!-- ===== PELICAN BODY ===== -->
  <!-- Tail -->
  <path d="M 260 260 L 175 210 L 185 265 L 165 275 L 205 305 L 250 315 Z" fill="#CFD8DC" stroke="#90A4AE" stroke-width="3" stroke-linejoin="round"/>

  <!-- Neck (outline + fill) -->
  <path d="M 410 260 C 460 220, 435 175, 470 135" fill="none" stroke="#B0BEC5" stroke-width="48" stroke-linecap="round"/>
  <path d="M 410 260 C 460 220, 435 175, 470 135" fill="none" stroke="url(#muse-ember-1.0-medium--bodyGrad)" stroke-width="38" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="350" cy="280" rx="122" ry="76" fill="url(#muse-ember-1.0-medium--bodyGrad)" stroke="#B0BEC5" stroke-width="3" transform="rotate(-14 350 280)"/>

  <!-- Belly shading -->
  <ellipse cx="365" cy="305" rx="85" ry="42" fill="#FFFFFF" opacity="0.7" transform="rotate(-14 365 305)"/>

  <!-- Scarf blowing in wind -->
  <path d="M 455 168 C 410 148, 365 165, 315 148 C 355 185, 410 200, 458 188 Z" fill="#E53935" stroke="#B71C1C" stroke-width="3" stroke-linejoin="round"/>

  <!-- Wing reaching to handlebar -->
  <path d="M 320 240 C 375 225, 465 255, 535 315 C 500 340, 410 345, 340 315 C 305 300, 295 255, 320 240 Z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="3"/>
  <path d="M 340 260 C 390 255, 450 275, 505 310" fill="none" stroke="#B0BEC5" stroke-width="4" stroke-linecap="round"/>

  <!-- Wing feathers detail -->
  <g fill="none" stroke="#B0BEC5" stroke-width="3" stroke-linecap="round">
    <path d="M 350 275 Q 400 285 430 275"/>
    <path d="M 350 295 Q 400 305 430 295"/>
  </g>

  <!-- Head -->
  <circle cx="475" cy="132" r="44" fill="url(#muse-ember-1.0-medium--bodyGrad)" stroke="#B0BEC5" stroke-width="3"/>
  <!-- Crest -->
  <path d="M 445 95 Q 460 75 480 88 Q 475 100 465 100 Z" fill="#CFD8DC"/>
  <path d="M 460 90 Q 478 72 495 85 Q 488 98 475 98 Z" fill="#ECEFF1"/>

  <!-- Beak - lower pouch -->
  <path d="M 510 148 L 672 176 C 640 232, 565 240, 528 190 C 518 175, 512 162, 510 148 Z" fill="#FFCC80" stroke="#FF8A3D" stroke-width="3" stroke-linejoin="round"/>
  <!-- Beak - upper mandible -->
  <path d="M 508 115 L 678 165 L 684 180 L 512 152 Z" fill="url(#muse-ember-1.0-medium--beakGrad)" stroke="#E65100" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 675 162 Q 690 170 682 185 Q 672 180 672 176 Z" fill="#E65100"/>

  <!-- Eye -->
  <circle cx="488" cy="122" r="7" fill="#263238"/>
  <circle cx="490" cy="120" r="2.5" fill="#FFFFFF"/>
  <path d="M 475 108 Q 488 102 500 108" fill="none" stroke="#78909C" stroke-width="3" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <circle cx="470" cy="145" r="10" fill="#FFAB91" opacity="0.45"/>

  <!-- Foreground flowers -->
  <g>
    <circle cx="80" cy="540" r="8" fill="#FF4081"/><circle cx="80" cy="540" r="3" fill="#FFD93D"/>
    <circle cx="720" cy="545" r="8" fill="#FF4081"/><circle cx="720" cy="545" r="3" fill="#FFD93D"/>
    <circle cx="140" cy="555" r="6" fill="#FFEB3B"/><circle cx="650" cy="560" r="6" fill="#FFEB3B"/>
  </g>
</svg>