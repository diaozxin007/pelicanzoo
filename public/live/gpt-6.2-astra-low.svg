<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="gpt-6.2-astra-low--title">A pelican riding a bicycle</title>
  <desc id="gpt-6.2-astra-low--desc">A white pelican with a golden bill pedals a coral-red bicycle along a sunny seaside path, its blue scarf fluttering behind it.</desc>

  <rect width="640" height="480" rx="24" fill="#dff5f2"/>
  <circle cx="527" cy="88" r="42" fill="#ffda86"/>
  <path d="M0 299 Q80 290 160 299 T320 299 T480 299 T640 299 V397 H0Z" fill="#a7dcd5"/>
  <path d="M0 343 Q101 330 208 344 T423 343 T640 341 V407 H0Z" fill="#80c6c2"/>
  <path d="M0 380 Q163 366 320 380 T640 379 V456 Q640 480 616 480 H24 Q0 480 0 456Z" fill="#f5dfb9"/>
  <ellipse cx="320" cy="411" rx="208" ry="10" fill="#d6bb94"/>

  <defs>
