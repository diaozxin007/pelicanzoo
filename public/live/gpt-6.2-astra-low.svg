    <path d="M258 249l153-17 M169 342l85-89" stroke="#ff9572" stroke-width="3"/>
    <path d="M257 251l-10-22 M410 217l-8-26q-1-6 6-6h24" stroke="#38525b" stroke-width="7"/>
