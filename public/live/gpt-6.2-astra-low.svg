    <path d="M192 192q22-19 63-22 37-3 49-25 6-13 3-40-3-32 19-46 22-14 46-2 19 10 19 29 0 20-20 31-15 9-18 32-4 44-34 72-24 25-67 24-44-1-63-28-10-16 3-25Z"
