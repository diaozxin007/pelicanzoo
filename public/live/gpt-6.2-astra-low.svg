    <path d="M245 228 Q252 255 279 268 L281 313 L299 322 L278 325 Q271 324 272 317 L267 279 Q242 269 231 247Z"
          fill="#e89a45" stroke="#754d38" stroke-width="3"/>
    <path d="M278 327h29" stroke="#263f48" stroke-width="6"/>

