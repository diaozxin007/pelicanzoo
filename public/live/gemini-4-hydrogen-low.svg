<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#e6f4fa" />
  <line x1="20" y1="262" x2="380" y2="262" stroke="#88b04b" stroke-width="4" stroke-linecap="round" />

  <!-- Bicycle Rear Wheel -->
  <g stroke="#333" fill="none">
    <circle cx="120" cy="220" r="40" stroke-width="5" />
    <circle cx="120" cy="220" r="35" stroke="#999" stroke-width="1.5" />
    <g stroke="#aaa" stroke-width="1.5">
      <line x1="120" y1="180" x2="120" y2="260" />
      <line x1="80" y1="220" x2="160" y2="220" />
      <line x1="92" y1="192" x2="148" y2="248" />
      <line x1="148" y1="192" x2="92" y2="248" />
    </g>
    <circle cx="120" cy="220" r="5" fill="#555" stroke="none" />
  </g>

  <!-- Bicycle Front Wheel -->
  <g stroke="#333" fill="none">
    <circle cx="280" cy="220" r="40" stroke-width="5" />
    <circle cx="280" cy="220" r="35" stroke="#999" stroke-width="1.5" />
    <g stroke="#aaa" stroke-width="1.5">
      <line x1="280" y1="180" x2="280" y2="260" />
      <line x1="240" y1="220" x2="320" y2="220" />
      <line x1="252" y1="192" x2="308" y2="248" />
      <line x1="308" y1="192" x2="252" y2="248" />
    </g>
    <circle cx="280" cy="220" r="5" fill="#555" stroke="none" />
  </g>

  <!-- Bicycle Frame -->
  <g stroke="#d94e4e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Rear triangle -->
    <line x1="120" y1="220" x2="185" y2="220" />
    <line x1="120" y1="220" x2="160" y2="155" />
    <!-- Main triangle -->
    <line x1="185" y1="220" x2="160" y2="155" />
    <line x1="160" y1="155" x2="250" y2="155" />
    <line x1="185" y1="220" x2="250" y2="155" />
    <!-- Front fork -->
    <line x1="250" y1="155" x2="280" y2="220" />
  </g>

  <!-- Seat & Handlebars -->
  <path d="M 145 152 Q 160 148 175 152" stroke="#333" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M 250 155 L 245 130 L 265 130" stroke="#555" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <line x1="260" y1="130" x2="270" y2="130" stroke="#333" stroke-width="6" stroke-linecap="round" />

  <!-- Pelican Back Leg (pedaling) -->
  <path d="M 168 150 L 178 195 L 172 205" stroke="#e08e26" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Pelican Body -->
  <g>
    <!-- Tail feathers -->
    <path d="M 135 125 L 112 118 L 122 132 L 110 138 L 135 140 Z" fill="#e6e6e6" stroke="#ccc" stroke-width="1.5" />
    <!-- Main body -->
    <ellipse cx="165" cy="128" rx="34" ry="24" transform="rotate(-10 165 128)" fill="#ffffff" stroke="#ccc" stroke-width="2" />
    <!-- Neck -->
    <path d="M 180 112 Q 192 90 190 68" stroke="#ffffff" stroke-width="18" stroke-linecap="round" fill="none" />
    <path d="M 172 110 Q 183 90 181 68" stroke="#ccc" stroke-width="1.5" fill="none" />
    <!-- Head -->
    <circle cx="192" cy="65" r="14" fill="#ffffff" stroke="#ccc" stroke-width="2" />
    <!-- Crest -->
    <path d="M 185 53 Q 175 45 172 52 Q 178 55 182 55" fill="#ffffff" stroke="#ccc" stroke-width="1.5" />
    <!-- Eye -->
    <circle cx="196" cy="62" r="2.8" fill="#222" />
    <circle cx="197" cy="61" r="1" fill="#fff" />

    <!-- Iconic Pelican Beak & Pouch -->
    <!-- Lower pouch -->
    <path d="M 200 68 Q 230 105 275 74 L 204 68 Z" fill="#f5a623" stroke="#d48817" stroke-width="2" stroke-linejoin="round" />
    <!-- Upper mandible -->
    <path d="M 203 60 Q 245 58 278 74 Q 240 72 202 68 Z" fill="#f8c24e" stroke="#d48817" stroke-width="2" stroke-linejoin="round" />
    <!-- Beak tip -->
    <path d="M 274 72 Q 280 75 275 78" stroke="#d94e4e" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Pelican Wing (reaching for handlebars) -->
  <path d="M 162 122 Q 205 115 262 130 Q 210 138 165 136 Z" fill="#f2f2f2" stroke="#ccc" stroke-width="2" stroke-linejoin="round" />

  <!-- Crank & Pedal -->
  <circle cx="185" cy="220" r="9" fill="#555" />
  <line x1="185" y1="220" x2="195" y2="238" stroke="#444" stroke-width="4" stroke-linecap="round" />
  <line x1="188" y1="238" x2="202" y2="238" stroke="#222" stroke-width="4" stroke-linecap="round" />

  <!-- Pelican Front Leg (on pedal) -->
  <path d="M 160 150 L 182 195 L 195 236" stroke="#f5a623" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Webbed foot on pedal -->
  <path d="M 190 236 L 203 236 L 198 232 Z" fill="#f5a623" stroke="#d48817" stroke-width="1.5" />
</svg>