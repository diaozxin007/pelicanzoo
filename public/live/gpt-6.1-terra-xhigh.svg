<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="gpt-6.1-terra-xhigh--title">Pelican riding a bicycle</title>
  <desc id="gpt-6.1-terra-xhigh--desc">A cheerful white pelican pedals a red bicycle beneath a sunny sky.</desc>

  <defs>
