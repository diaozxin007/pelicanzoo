        <path d="M-48-48L48 48 M48-48L-48 48"/>
        <path d="M-26-63L26 63 M26-63L-26 63"/>
        <path d="M-63-26L63 26 M63-26L-63 26"/>
      </g>
      <circle r="8" fill="#30494b"/>
      <circle r="3" fill="#f7e4b5"/>
    </g>
  </defs>

  <!-- Sky and ground -->
