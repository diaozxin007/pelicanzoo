<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#bfe6ff"/>
  <!-- Ground -->
  <rect y="250" width="400" height="50" fill="#8bc34a"/>

  <!-- Bicycle wheels -->
  <circle cx="110" cy="220" r="40" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="290" cy="220" r="40" fill="none" stroke="#333" stroke-width="6"/>
  <!-- Spokes -->
  <g stroke="#777" stroke-width="1.5">
    <line x1="110" y1="180" x2="110" y2="260"/>
    <line x1="70" y1="220" x2="150" y2="220"/>
    <line x1="82" y1="192" x2="138" y2="248"/>
    <line x1="138" y1="192" x2="82" y2="248"/>
    <line x1="290" y1="180" x2="290" y2="260"/>
    <line x1="250" y1="220" x2="330" y2="220"/>
    <line x1="262" y1="192" x2="318" y2="248"/>
    <line x1="318" y1="192" x2="262" y2="248"/>
  </g>

  <!-- Bicycle frame -->
  <g stroke="#d32f2f" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="110" y1="220" x2="190" y2="220"/>
    <line x1="110" y1="220" x2="160" y2="160"/>
    <line x1="160" y1="160" x2="190" y2="220"/>
    <line x1="160" y1="160" x2="260" y2="160"/>
    <line x1="190" y1="220" x2="260" y2="160"/>
    <line x1="260" y1="160" x2="290" y2="220"/>
    <line x1="260" y1="160" x2="255" y2="135"/>
  </g>
  <!-- Handlebar -->
  <path d="M245 135 L270 130" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <!-- Seat -->
  <ellipse cx="160" cy="155" rx="16" ry="5" fill="#333"/>
  <!-- Pedals / crank -->
  <circle cx="190" cy="220" r="8" fill="#555"/>
  <line x1="190" y1="220" x2="200" y2="238" stroke="#555" stroke-width="4"/>

  <!-- Pelican legs -->
  <g stroke="#f4a300" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M165 135 L185 190 L200 238"/>
    <path d="M175 135 L195 180 L182 205"/>
  </g>
  <!-- Feet -->
  <ellipse cx="203" cy="240" rx="9" ry="4" fill="#f4a300"/>

  <!-- Pelican body -->
  <ellipse cx="170" cy="115" rx="45" ry="30" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <!-- Wing -->
  <path d="M140 105 Q175 90 205 115 Q180 135 145 125 Z" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
  <!-- Wing reaching to handlebar -->
  <path d="M195 110 Q230 115 250 133" stroke="#e0e0e0" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Tail -->
  <path d="M127 110 L108 100 L112 122 Z" fill="#e0e0e0" stroke="#999" stroke-width="2"/>

  <!-- Neck -->
  <path d="M200 100 Q215 70 205 50" stroke="#fafafa" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Head -->
  <circle cx="208" cy="45" r="16" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="213" cy="41" r="3" fill="#222"/>
  <!-- Beak (upper) -->
  <path d="M220 42 L285 55 L222 52 Z" fill="#ffb300" stroke="#c77c00" stroke-width="1.5"/>
  <!-- Throat pouch -->
  <path d="M222 52 L285 55 Q250 80 220 60 Z" fill="#ff9800" stroke="#c77c00" stroke-width="1.5"/>

  <!-- Motion lines -->
  <g stroke="#fff" stroke-width="3" stroke-linecap="round">
    <line x1="30" y1="190" x2="60" y2="190"/>
    <line x1="20" y1="210" x2="55" y2="210"/>
    <line x1="35" y1="230" x2="60" y2="230"/>
  </g>
</svg>