  <path d="M367 415l-20 17 44 2z" fill="#f4ae46" stroke="#bd7830" stroke-width="3"/>

  <!-- Tail and body -->
  <path d="M284 237l-62-25 34 43-45-5 60 38" fill="#eef4f3" stroke="#344b58" stroke-width="4" stroke-linejoin="round"/>
  <path d="M271 217c34-35 91-46 127-13 23 22 21 61-5 83-27 23-78 20-109 0-24-15-31-49-13-70z"
