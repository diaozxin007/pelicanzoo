  <path d="M439 482l5 10m8-11 5 12" stroke="#d88e35" stroke-width="2"/>

  <!-- Hub caps and motion accents -->
  <g fill="#344b58">
    <circle cx="232" cy="462" r="8"/>
    <circle cx="579" cy="462" r="8"/>
  </g>
  <g fill="none" stroke="#7bafad" stroke-width="4" stroke-linecap="round">
    <path d="M103 316h65m-88 23h55m-30 24h33"/>
