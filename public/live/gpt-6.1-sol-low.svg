  <path d="M477 149c25 25 55 37 85 20" fill="none" stroke="#df8537" stroke-width="3" stroke-linecap="round"/>

  <!-- Face and jaunty feathers -->
  <circle cx="432" cy="105" r="8" fill="#293c4c"/>
  <circle cx="434" cy="102" r="2.5" fill="#fff"/>
  <path d="M408 87l-13-18m20 15-2-23m11 24 8-19"
