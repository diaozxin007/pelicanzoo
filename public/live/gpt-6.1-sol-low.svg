  <path d="M393 153c-9 25-11 49-5 68" fill="none" stroke="#dce6e4" stroke-width="9" stroke-linecap="round"/>

  <!-- Pelican pouch and long bill -->
  <path d="M443 119l177 19c-29 43-64 71-110 52-31-13-49-38-67-71z"
