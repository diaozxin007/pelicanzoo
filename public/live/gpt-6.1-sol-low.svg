<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
  <title id="gpt-6.1-sol-low--title">Pelican riding a bicycle</title>
  <desc id="gpt-6.1-sol-low--desc">A cheerful white pelican with a long orange bill pedals a teal bicycle beneath a sunny sky.</desc>

  <defs>
    <linearGradient id="gpt-6.1-sol-low--sky" x2="0" y2="1">
      <stop stop-color="#dff4ff"/>
      <stop offset="1" stop-color="#fff8e8"/>
    </linearGradient>
    <linearGradient id="gpt-6.1-sol-low--bill" x2="0" y2="1">
      <stop stop-color="#ffc757"/>
      <stop offset="1" stop-color="#ef9637"/>
    </linearGradient>
  </defs>

  <!-- Sunny backdrop -->
  <rect width="800" height="650" rx="28" fill="url(#gpt-6.1-sol-low--sky)"/>
  <circle cx="664" cy="112" r="48" fill="#ffdb75"/>
  <g fill="#fff" opacity=".85">
    <path d="M77 132c-8-24 21-43 40-29 8-33 58-30 62 3 28-10 46 8 42 26z"/>
    <path d="M474 85c-4-19 19-31 33-22 12-25 43-19 47 5 20-6 35 4 33 17z"/>
  </g>
  <path d="M0 537 Q180 508 365 534 T800 526 V650 H0Z" fill="#c7dfb1"/>
  <ellipse cx="401" cy="570" rx="284" ry="19" fill="#8caf8f" opacity=".3"/>

  <!-- Wheels -->
  <g stroke="#293c4c" fill="none">
    <g stroke-width="12">
      <circle cx="232" cy="462" r="99"/>
      <circle cx="579" cy="462" r="99"/>
    </g>
    <g stroke="#f9ffff" stroke-width="3">
      <circle cx="232" cy="462" r="86"/>
      <circle cx="579" cy="462" r="86"/>
    </g>
    <g stroke="#91a8b3" stroke-width="2">
      <path d="M232 376v172m-86-86h172m-147-61 122 122m-122 0 122-122"/>
      <path d="M579 376v172m-86-86h172m-147-61 122 122m-122 0 122-122"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 462l104-146 66 146H232l126-124h167L402 462"
          stroke="#188f99" stroke-width="12"/>
    <path d="M579 462l-64-173" stroke="#188f99" stroke-width="12"/>
    <path d="M514 291l-13-38 48-14" stroke="#344b58" stroke-width="9"/>
    <path d="M550 239l20 4" stroke="#293c4c" stroke-width="12"/>
    <path d="M336 316l-10-31" stroke="#344b58" stroke-width="8"/>
    <path d="M301 283h54" stroke="#293c4c" stroke-width="14"/>
    <circle cx="402" cy="462" r="21" stroke="#344b58" stroke-width="6" fill="#d7e5e9"/>
    <path d="M402 462l39 24m-39-24-30-31" stroke="#344b58" stroke-width="7"/>
    <path d="M429 490h30m-103-60h29" stroke="#293c4c" stroke-width="7"/>
  </g>

  <!-- Far leg -->
  <path d="M357 267l-29 72 44 84" fill="none" stroke="#e79b3c"
