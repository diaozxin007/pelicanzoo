  <g fill="none" stroke="#bacdcc" stroke-width="3" stroke-linecap="round">
    <path d="M322 232l49 24"/>
    <path d="M325 245l37 18"/>
    <path d="M371 254l67 27"/>
  </g>

  <!-- Near leg and webbed foot -->
  <path d="M379 285l48 74-20 88 34 37"
