<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="gpt-6-astra-medium--title">A pelican riding a bicycle</title>
  <desc id="gpt-6-astra-medium--desc">A cheerful white pelican with a long golden bill pedals a coral-red bicycle beneath a sunny blue sky.</desc>

  <defs>
    <linearGradient id="gpt-6-astra-medium--sky" x2="0" y2="1">
      <stop stop-color="#dff5ff"/>
      <stop offset="1" stop-color="#fffbed"/>
    </linearGradient>
    <linearGradient id="gpt-6-astra-medium--pouch" x2="0" y2="1">
      <stop stop-color="#ffd974"/>
      <stop offset="1" stop-color="#efaa43"/>
    </linearGradient>
  </defs>

  <!-- Sunshine and scenery -->
  <rect width="800" height="600" fill="url(#gpt-6-astra-medium--sky)"/>
  <circle cx="665" cy="99" r="43" fill="#ffe79a"/>
