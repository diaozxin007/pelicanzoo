<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#bfe6ff"/>
  <!-- Ground -->
  <rect y="265" width="400" height="35" fill="#8fce6b"/>
  <line x1="0" y1="265" x2="400" y2="265" stroke="#6aa84f" stroke-width="2"/>

  <!-- Sun -->
  <circle cx="350" cy="45" r="22" fill="#ffd84d"/>

  <!-- ===== BICYCLE ===== -->
  <g stroke="#333" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <circle cx="110" cy="220" r="45" stroke-width="5"/>
    <circle cx="290" cy="220" r="45" stroke-width="5"/>
    <!-- Spokes -->
    <g stroke-width="1" stroke="#777">
      <line x1="110" y1="175" x2="110" y2="265"/>
      <line x1="65" y1="220" x2="155" y2="220"/>
      <line x1="78" y1="188" x2="142" y2="252"/>
      <line x1="142" y1="188" x2="78" y2="252"/>
      <line x1="290" y1="175" x2="290" y2="265"/>
      <line x1="245" y1="220" x2="335" y2="220"/>
      <line x1="258" y1="188" x2="322" y2="252"/>
      <line x1="322" y1="188" x2="258" y2="252"/>
    </g>
    <!-- Frame -->
    <g stroke="#d62828" stroke-width="6">
      <line x1="110" y1="220" x2="190" y2="222"/>  <!-- chain stay -->
      <line x1="110" y1="220" x2="172" y2="155"/>  <!-- seat stay -->
      <line x1="190" y1="222" x2="172" y2="155"/>  <!-- seat tube -->
      <line x1="172" y1="158" x2="265" y2="160"/>  <!-- top tube -->
      <line x1="190" y1="222" x2="265" y2="160"/>  <!-- down tube -->
      <line x1="265" y1="160" x2="290" y2="220"/>  <!-- fork -->
    </g>
    <!-- Handlebar stem & bars -->
    <line x1="265" y1="160" x2="258" y2="135" stroke-width="5"/>
    <path d="M250 133 Q262 128 275 136" stroke-width="5"/>
    <!-- Seat -->
    <path d="M158 150 L186 150" stroke="#222" stroke-width="7"/>
    <!-- Hubs -->
    <circle cx="110" cy="220" r="4" fill="#333"/>
    <circle cx="290" cy="220" r="4" fill="#333"/>
    <!-- Chainring & crank -->
    <circle cx="190" cy="222" r="10" stroke-width="3"/>
    <line x1="190" y1="222" x2="205" y2="240" stroke-width="4"/>
    <line x1="190" y1="222" x2="175" y2="204" stroke-width="4"/>
    <!-- Pedals -->
    <line x1="198" y1="240" x2="212" y2="240" stroke-width="5"/>
    <line x1="168" y1="204" x2="182" y2="204" stroke-width="5"/>
  </g>

  <!-- ===== PELICAN ===== -->
  <!-- Back leg -->
  <g stroke="#f28c28" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 150 L160 180 L175 204"/>
  </g>
  <!-- Tail -->
  <path d="M130 125 L100 115 L108 130 L98 140 L135 138 Z" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
  <!-- Body -->
  <ellipse cx="175" cy="125" rx="50" ry="32" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <!-- Wing -->
  <path d="M145 112 Q180 95 212 118 Q190 140 150 138 Q138 128 145 112 Z"
        fill="#e4e4e4" stroke="#999" stroke-width="1.5"/>
  <path d="M155 130 Q175 128 195 124" stroke="#aaa" stroke-width="1.5" fill="none"/>
  <!-- Front leg -->
  <g stroke="#f28c28" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 150 L212 190 L205 240"/>
  </g>
  <!-- Feet -->
  <path d="M197 240 L215 240 L210 244 Z" fill="#f28c28"/>
  <path d="M167 204 L185 204 L180 208 Z" fill="#f28c28"/>
  <!-- Wing tip reaching to handlebar -->
  <path d="M205 118 Q235 125 258 134" stroke="#999" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M205 118 Q235 125 258 134" stroke="#e4e4e4" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <path d="M200 105 Q215 80 225 65 Q232 55 240 58 Q230 75 222 110 Z"
        fill="#ffffff" stroke="#999" stroke-width="2"/>
  <!-- Head -->
  <circle cx="238" cy="55" r="16" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <!-- Crest -->
  <path d="M230 41 Q226 30 236 34 Q238 28 244 38" fill="#fff3c4" stroke="#999" stroke-width="1.5"/>
  <!-- Beak (upper mandible) -->
  <path d="M250 50 L335 62 Q340 65 334 68 L252 62 Z" fill="#ffb627" stroke="#c77d00" stroke-width="1.5"/>
  <!-- Pouch (lower) -->
  <path d="M252 62 L334 68 Q300 100 265 85 Q252 76 252 62 Z" fill="#ff9f43" stroke="#c77d00" stroke-width="1.5"/>
  <!-- Beak hook -->
  <path d="M333 62 Q342 64 336 71" fill="none" stroke="#c77d00" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="242" cy="51" r="4" fill="#fff"/>
  <circle cx="243" cy="51" r="2.3" fill="#111"/>

  <!-- Motion lines -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="30" y1="190" x2="55" y2="190"/>
    <line x1="20" y1="210" x2="50" y2="210"/>
    <line x1="35" y1="230" x2="58" y2="230"/>
  </g>
</svg>