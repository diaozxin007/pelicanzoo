  <circle cx="380" cy="410" r="20" fill="none" stroke="#526b68" stroke-width="3"/>
  <circle cx="380" cy="410" r="4" fill="#dcb85e" stroke="#29474a" stroke-width="2"/>
  <g fill="none" class="ink" stroke="#344f52" stroke-width="6">
    <path d="m380 410 27-27m-27 27-27 27"/>
    <path d="m397 386 22-7m-76 62 22-7" stroke-width="5"/>
  </g>
  <g fill="#dcb85e" class="ink" stroke-width="2">
