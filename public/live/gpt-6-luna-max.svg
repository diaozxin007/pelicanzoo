  <path d="M307 269c9-2 17-1 24 2" fill="none" stroke="#86aaa0" stroke-width="2" stroke-linecap="round"/>

  <path d="m500 278 6-27" fill="none" class="ink" stroke="#334f52" stroke-width="7"/>
  <path d="M488 251h43c9 0 15-4 20-11l8 3c-4 11-12 17-27 17h-44"
