  <g fill="none" stroke="#d5c5a5" stroke-width="2.2" stroke-linecap="round">
    <path d="M352 223c14 5 25 15 32 29"/>
    <path d="M365 211c15 7 25 18 30 31"/>
    <path d="M381 207c13 8 21 17 24 28"/>
  </g>

  <!-- Wing reaching the handlebar -->
  <path d="M408 205c18-8 35-2 51 10l49 31c12 8 20 15 15 22-5 7-12 3-21-2l-41-21c-16-8-30-2-45 4-9-11-12-29-8-44z"
        fill="#fff8e9" class="ink" stroke-width="3.5"/>
  <g fill="none" stroke="#d8c8a9" stroke-width="2" stroke-linecap="round">
    <path d="M423 215c15 0 28 8 41 18"/>
    <path d="M420 225c15 1 27 8 39 16"/>
  </g>

  <!-- Head and bill -->
  <circle cx="456" cy="140" r="23" fill="#fffdf5" class="ink" stroke-width="4"/>
  <circle cx="463" cy="136" r="5.4" fill="#fff"/>
  <circle cx="465" cy="136" r="3.3" fill="#20383b"/>
  <circle cx="466" cy="135" r="1.1" fill="#fff"/>

  <path d="M471 138c48-10 115-5 178 13-43 19-121 11-180 1z"
