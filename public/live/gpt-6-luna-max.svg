    <path d="M357 432c-5 1-7 5-10 8l-7 3c6 4 13 3 19-1l7-2 8 2 5-5-12-6z"/>
  </g>
  <path d="M404 381q5 4 9 1M350 441q5 2 10-2" fill="none" stroke="#ffd18b" stroke-width="2" stroke-linecap="round"/>

