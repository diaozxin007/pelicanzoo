  <path d="M205 392h175a18 18 0 0 1 0 36H205a18 18 0 0 1 0-36z"
        fill="none" stroke="#6c817a" stroke-width="2.2" opacity=".9"/>

  <g fill="none" class="ink" stroke="#27838a" stroke-width="9">
    <path d="M205 410 336 286 380 410 205 410"/>
    <path d="M336 286 500 278 380 410"/>
    <path d="M500 278 511 326 585 410"/>
    <path d="m505 326 74 84" stroke-width="5"/>
  </g>

