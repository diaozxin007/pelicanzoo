<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="gpt-6-luna-max--title">Pelican riding a bicycle</title>
  <desc id="gpt-6-luna-max--desc">A cheerful white pelican pedals a teal bicycle beneath a sunny sky.</desc>

  <defs>
    <linearGradient id="gpt-6-luna-max--paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6e9"/>
      <stop offset="1" stop-color="#f5f0df"/>
    </linearGradient>
    <linearGradient id="gpt-6-luna-max--feathers" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#f3ead8"/>
    </linearGradient>
    <style>
      .ink { stroke: #29474a; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Soft, sunny countryside -->
  <rect width="800" height="560" fill="url(#gpt-6-luna-max--paper)"/>
  <circle cx="681" cy="91" r="43" fill="#f4d67d"/>
  <circle cx="681" cy="91" r="55" fill="none" stroke="#f4d67d" stroke-width="2" opacity=".35"/>

  <g fill="#fffdf5" opacity=".9">
    <path d="M91 119c2-13 13-22 26-22 10 0 18 5 22 13 4-3 9-5 15-5 14 0 25 10 25 23H91c-1-3-1-6 0-9z"/>
    <path d="M582 188c2-9 10-15 19-15 7 0 13 4 16 9 3-2 7-3 11-3 10 0 18 7 19 16h-65v-7z"/>
  </g>

  <path d="M0 365c100-32 187-22 276-8 90 14 139-6 223-4 104 3 188 29 301 0v207H0z" fill="#e7ead8"/>
  <path d="M0 482c117-17 222 1 334-5 142-8 286 10 466-5v88H0z" fill="#dce5d2"/>
  <path d="M0 501c186-11 310 4 451-2 143-6 238 2 349-3" fill="none" stroke="#c6d3c2" stroke-width="3"/>

  <!-- Ground shadows -->
  <ellipse cx="205" cy="514" rx="105" ry="10" fill="#536d64" opacity=".14"/>
  <ellipse cx="585" cy="514" rx="105" ry="10" fill="#536d64" opacity=".14"/>

  <!-- Bicycle wheels -->
  <g transform="translate(205 410)">
    <circle r="99" fill="none" stroke="#263f43" stroke-width="13"/>
    <circle r="96" fill="none" stroke="#607a76" stroke-width="2" opacity=".8"/>
    <g fill="none" stroke="#a8b6aa" stroke-width="1.7">
      <path d="M0-87v174M43.5-75.3l-87 150.6M75.3-43.5l-150.6 87M87 0h-174M75.3 43.5l-150.6-87M43.5 75.3l-87-150.6"/>
    </g>
    <circle r="88" fill="none" stroke="#e4e8dc" stroke-width="3"/>
    <circle r="10" fill="#dcb85e" stroke="#29474a" stroke-width="3"/>
    <circle r="3.5" fill="#29474a"/>
  </g>

  <g transform="translate(585 410)">
    <circle r="99" fill="none" stroke="#263f43" stroke-width="13"/>
    <circle r="96" fill="none" stroke="#607a76" stroke-width="2" opacity=".8"/>
    <g fill="none" stroke="#a8b6aa" stroke-width="1.7">
      <path d="M0-87v174M43.5-75.3l-87 150.6M75.3-43.5l-150.6 87M87 0h-174M75.3 43.5l-150.6-87M43.5 75.3l-87-150.6"/>
    </g>
    <circle r="88" fill="none" stroke="#e4e8dc" stroke-width="3"/>
    <circle r="10" fill="#dcb85e" stroke="#29474a" stroke-width="3"/>
    <circle r="3.5" fill="#29474a"/>
  </g>

