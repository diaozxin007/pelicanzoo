<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="gpt-6.1-sol-max--title">A pelican riding a bicycle</title>
  <desc id="gpt-6.1-sol-max--desc">
    A cheerful white pelican with a long golden bill and webbed feet
    pedals a coral bicycle along a sunny coastal path.
  </desc>

  <defs>
    <linearGradient id="gpt-6.1-sol-max--sky" x2="0" y2="1">
      <stop stop-color="#edf8f7"/>
      <stop offset="1" stop-color="#f8f8ed"/>
    </linearGradient>
    <linearGradient id="gpt-6.1-sol-max--feathers" x2="0" y2="1">
      <stop stop-color="#fffef8"/>
      <stop offset="1" stop-color="#edf3e9"/>
    </linearGradient>
    <linearGradient id="gpt-6.1-sol-max--wing" x2="0" y2="1">
      <stop stop-color="#f4f8f1"/>
      <stop offset="1" stop-color="#d5e5df"/>
    </linearGradient>
    <linearGradient id="gpt-6.1-sol-max--pouch" x2="0" y2="1">
      <stop stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#f3bd5b"/>
    </linearGradient>

    <g id="gpt-6.1-sol-max--wheel">
      <circle r="104" fill="#fbfdf7" fill-opacity=".65"
              stroke="#29464e" stroke-width="12"/>
      <circle r="104" fill="none" stroke="#ffffff"
              stroke-width="2" opacity=".22"/>
      <circle r="92" fill="none" stroke="#9cb9b8" stroke-width="2"/>
      <path d="M0-92V92 M-92 0H92
               M-80-46L80 46 M-46-80L46 80
               M46-80L-46 80 M80-46L-80 46"
            fill="none" stroke="#afc6c3" stroke-width="2.2"/>
      <circle r="10" fill="#29464e"/>
      <circle r="4" fill="#d5e5df"/>
    </g>
  </defs>

  <!-- Sunny seaside backdrop -->
  <path fill="url(#gpt-6.1-sol-max--sky)" d="M0 0H900V700H0z"/>
  <circle cx="458" cy="325" r="254" fill="#dceee7"/>
  <circle cx="151" cy="136" r="57" fill="#ffdc83"/>
  <circle cx="137" cy="121" r="16" fill="#fff0b4" opacity=".65"/>

  <g fill="#ffffff" opacity=".88">
    <path d="M63 229C62 214 77 204 93 208
