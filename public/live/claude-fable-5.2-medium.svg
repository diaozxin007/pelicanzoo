<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <rect width="600" height="450" fill="#cfeaf7"/>
  <rect y="370" width="600" height="80" fill="#8fc97a"/>
  <circle cx="520" cy="70" r="35" fill="#ffd94a"/>

  <!-- wheels -->
  <g fill="none" stroke="#333" stroke-width="6">
    <circle cx="170" cy="320" r="60"/>
    <circle cx="430" cy="320" r="60"/>
  </g>
  <g stroke="#999" stroke-width="2">
    <line x1="110" y1="320" x2="230" y2="320"/>
    <line x1="170" y1="260" x2="170" y2="380"/>
    <line x1="128" y1="278" x2="212" y2="362"/>
    <line x1="128" y1="362" x2="212" y2="278"/>
    <line x1="370" y1="320" x2="490" y2="320"/>
    <line x1="430" y1="260" x2="430" y2="380"/>
    <line x1="388" y1="278" x2="472" y2="362"/>
    <line x1="388" y1="362" x2="472" y2="278"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#d63b3b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 320 L250 230 L390 230 L300 320 Z"/>
    <path d="M250 230 L300 320"/>
    <path d="M430 320 L385 205"/>
    <path d="M243 215 L250 230"/>
  </g>
  <path d="M385 205 L410 195" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <rect x="220" y="207" width="50" height="10" rx="5" fill="#333"/>

  <!-- pedals/crank -->
  <circle cx="300" cy="320" r="10" fill="#555"/>
  <line x1="300" y1="320" x2="318" y2="345" stroke="#555" stroke-width="5"/>
  <rect x="306" y="343" width="26" height="6" rx="3" fill="#333"/>

  <!-- leg -->
  <path d="M260 200 L305 270 L318 343" fill="none" stroke="#f29a2e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M305 340 L338 340 L330 348 L308 348 Z" fill="#f29a2e"/>

  <!-- body -->
  <ellipse cx="255" cy="165" rx="70" ry="50" fill="#fff" stroke="#bbb" stroke-width="2" transform="rotate(-15 255 165)"/>
  <path d="M185 180 L150 200 L195 195 Z" fill="#fff" stroke="#bbb" stroke-width="2"/>
  <!-- wing reaching to handlebar -->
  <path d="M240 150 Q300 150 400 197 Q320 215 250 190 Z" fill="#eee" stroke="#bbb" stroke-width="2"/>

  <!-- neck & head -->
  <path d="M300 140 Q330 110 315 75" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
  <circle cx="320" cy="65" r="26" fill="#fff" stroke="#bbb" stroke-width="2"/>
  <circle cx="328" cy="58" r="5" fill="#222"/>

  <!-- beak -->
  <path d="M340 55 L460 80 L342 78 Z" fill="#f6b23c" stroke="#d68a1e" stroke-width="2"/>
  <path d="M342 78 L455 81 Q400 130 350 100 Z" fill="#f9c96a" stroke="#d68a1e" stroke-width="2"/>
</svg>