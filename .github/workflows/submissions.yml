name: submissions
on:
  pull_request:
    paths: ['submissions/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/check-submissions.mjs
      # A submission can pass the sanitiser and still break the page it lands
      # on, so build the site the way Cloudflare will before merging it.
      - run: npm ci
      - run: npm run build
